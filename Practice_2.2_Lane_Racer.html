<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practice 2.2 - Lane Racer</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;font-family:"Comic Sans MS","Baloo 2","Trebuchet MS",sans-serif;user-select:none;touch-action:manipulation}
  body{background:linear-gradient(#7fd3ff 0%,#c9f0ff 22%,#8fdc62 22%,#6cc24a 100%);display:flex;flex-direction:column;align-items:center}

  #hud{width:100%;display:flex;justify-content:space-between;align-items:center;padding:10px 18px;z-index:5}
  #title{background:#fff;border-radius:20px;padding:6px 16px;font-weight:bold;color:#e8590c;font-size:clamp(16px,2.6vw,26px);box-shadow:0 3px 0 #ffd199}
  #stars{font-size:clamp(20px,3vw,30px);background:#fff;border-radius:20px;padding:4px 14px;box-shadow:0 3px 0 #cfe}

  #target{display:flex;align-items:center;gap:14px;z-index:5;margin-top:-4px}
  #num{background:#fff;border:6px solid #ff922b;border-radius:28px;min-width:clamp(110px,18vw,170px);text-align:center;font-size:clamp(60px,12vw,110px);font-weight:bold;color:#e8590c;line-height:1.1;padding:0 20px;box-shadow:0 7px 0 #d9480f}
  #num.change{animation:pop .4s}
  @keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
  #speak{width:54px;height:54px;border-radius:50%;border:none;background:#4dabf7;color:#fff;font-size:26px;cursor:pointer;box-shadow:0 4px 0 #1c7ed6}
  #speak:active{transform:translateY(3px);box-shadow:0 1px 0 #1c7ed6}

  #roadwrap{position:relative;flex:1;width:min(92vw,560px);margin-top:10px;margin-bottom:84px;min-height:200px}
  #road{position:absolute;inset:0;background:#4a4f57;border-left:10px solid #fff;border-right:10px solid #fff;overflow:hidden;border-radius:6px;box-shadow:0 0 0 6px #2b2f36}
  #road::before{content:"";position:absolute;left:50%;top:-80px;bottom:0;width:10px;margin-left:-5px;
    background:repeating-linear-gradient(to bottom,#ffe066 0 40px,transparent 40px 80px);animation:dash .35s linear infinite}
  @keyframes dash{to{transform:translateY(80px)}}
  .sign{position:absolute;width:50%;display:flex;justify-content:center;top:0;will-change:transform}
  .sign span{background:#fff8dc;border:5px solid #c98a3b;border-radius:16px;padding:4px 16px;font-size:clamp(28px,6vw,52px);font-weight:bold;color:#d6336c;box-shadow:0 5px 0 #a8702a}
  .sign.good span{background:#d3f9d8;border-color:#2f9e44;color:#2b8a3e}
  .sign.bad span{background:#ffe3e3;border-color:#e03131}

  #car{position:absolute;bottom:4%;width:50%;display:flex;justify-content:center;transition:left .14s ease-out;z-index:3}
  #car svg{width:min(120px,50%);height:auto;overflow:visible}
  #car.bump{animation:bump .5s}
  @keyframes bump{0%,100%{transform:rotate(0)}20%{transform:rotate(-12deg) translateY(-6px)}40%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(6deg)}}
  #car.cheer{animation:cheer .5s}
  @keyframes cheer{0%,100%{transform:translateY(0)}40%{transform:translateY(-20px)}}

  #controls{position:fixed;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:clamp(20px,10vw,120px);z-index:6}
  #controls button{width:clamp(70px,12vw,100px);height:clamp(56px,9vw,72px);border:none;border-radius:20px;background:#ffd43b;color:#8a5a00;font-size:36px;cursor:pointer;box-shadow:0 6px 0 #e0a800}
  #controls button:active{transform:translateY(4px);box-shadow:0 2px 0 #e0a800}

  #msg{position:fixed;left:50%;top:45%;transform:translate(-50%,-50%) scale(0);font-size:clamp(36px,8vw,80px);font-weight:bold;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.3);z-index:40;pointer-events:none;white-space:nowrap}
  #msg.show{animation:msg 1.1s forwards}
  @keyframes msg{0%{transform:translate(-50%,-50%) scale(0)}25%{transform:translate(-50%,-50%) scale(1.15)}70%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
  .conf{position:fixed;font-size:28px;z-index:30;pointer-events:none;animation:fall 1.2s ease-out forwards}
  @keyframes fall{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--dx),var(--dy)) rotate(360deg) scale(.6);opacity:0}}

  #end{position:fixed;inset:0;background:rgba(255,255,255,.93);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:50;text-align:center}
  #end h1{font-size:clamp(36px,7vw,72px);color:#e8590c}
  #end .big{font-size:clamp(40px,8vw,80px)}
  #start{position:fixed;inset:0;background:linear-gradient(#7fd3ff,#c9f0ff);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:60;text-align:center;padding:20px}
  #start h1{font-size:clamp(34px,7vw,70px);color:#e8590c;text-shadow:0 3px 0 #fff}
  #start p{font-size:clamp(18px,3vw,28px);color:#1864ab;max-width:700px}
  .bigbtn{font:inherit;font-size:clamp(26px,5vw,44px);padding:12px 50px;border:none;border-radius:50px;background:#ff922b;color:#fff;cursor:pointer;box-shadow:0 7px 0 #d9480f}
  .bigbtn:active{transform:translateY(5px);box-shadow:0 2px 0 #d9480f}
</style>
</head>
<body>
<div id="hud">
  <div id="title">🚗 Lane Racer</div>
  <div id="stars">⭐ 0 / 5</div>
</div>

<div id="target">
  <div id="num">7</div>
  <button id="speak" title="Listen">🔊</button>
</div>

<div id="roadwrap">
  <div id="road">
    <div id="signL" class="sign" style="left:0"><span></span></div>
    <div id="signR" class="sign" style="left:50%"><span></span></div>
    <div id="car">
      <svg viewBox="0 0 120 170" aria-hidden="true">
        <rect x="14" y="30" width="16" height="36" rx="5" fill="#222"/><rect x="90" y="30" width="16" height="36" rx="5" fill="#222"/>
        <rect x="14" y="112" width="16" height="36" rx="5" fill="#222"/><rect x="90" y="112" width="16" height="36" rx="5" fill="#222"/>
        <rect x="24" y="8" width="72" height="154" rx="30" fill="#ff4d4d"/>
        <rect x="24" y="8" width="72" height="154" rx="30" fill="none" stroke="#c92a2a" stroke-width="4"/>
        <rect x="34" y="40" width="52" height="34" rx="10" fill="#a5d8ff"/>
        <rect x="34" y="104" width="52" height="26" rx="10" fill="#a5d8ff"/>
        <rect x="54" y="8" width="12" height="154" fill="#fff" opacity=".85"/>
        <circle cx="40" cy="20" r="7" fill="#ffec99"/><circle cx="80" cy="20" r="7" fill="#ffec99"/>
        <circle cx="40" cy="150" r="6" fill="#ff8787"/><circle cx="80" cy="150" r="6" fill="#ff8787"/>
      </svg>
    </div>
  </div>
</div>

<div id="controls">
  <button id="left" aria-label="Left">◀</button>
  <button id="right" aria-label="Right">▶</button>
</div>

<div id="msg"></div>

<div id="start">
  <h1>🚗 Lane Racer 🚗</h1>
  <p>Look at the number on top.<br>Drive the car into the lane with the right word!<br>Tap ◀ ▶ or the left / right side of the road.</p>
  <button class="bigbtn" id="startBtn">▶ Play</button>
</div>

<div id="end">
  <h1>Great driving! 🎉</h1>
  <div class="big" id="endStars"></div>
  <button class="bigbtn" id="again" style="background:#40c057;box-shadow:0 7px 0 #2b8a3e">↻ Play again</button>
</div>

<script>
(function(){
  var WORDS = {6:"six",7:"seven",8:"eight",9:"nine",10:"ten"};
  var road=document.getElementById("road"), car=document.getElementById("car");
  var numEl=document.getElementById("num"), starsEl=document.getElementById("stars"), msgEl=document.getElementById("msg");
  var signs=[document.getElementById("signL"),document.getElementById("signR")];
  var order, idx, score, lane, y, running, triedWrong, correctLane, last, audioCtx;

  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

  function tone(freq,dur,type,delay,vol){
    try{
      audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
      var o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.type=type||"sine";o.frequency.value=freq;
      var t0=audioCtx.currentTime+(delay||0);
      g.gain.setValueAtTime(vol||.2,t0);g.gain.exponentialRampToValueAtTime(.001,t0+dur);
      o.connect(g);g.connect(audioCtx.destination);o.start(t0);o.stop(t0+dur);
    }catch(e){}
  }
  function sfxMove(){tone(500,.06,"square",0,.05)}
  function sfxOK(){tone(880,.1,"triangle",0,.25);tone(1175,.15,"triangle",.1,.25);tone(1568,.25,"triangle",.2,.25)}
  function sfxBad(){tone(220,.25,"sawtooth",0,.12);tone(165,.3,"sawtooth",.15,.12)}
  function sfxWin(){[523,659,784,1047].forEach(function(f,i){tone(f,.3,"triangle",i*.15,.25)})}
  function speak(t){try{if(!window.speechSynthesis)return;speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.8;u.pitch=1.2;speechSynthesis.speak(u)}catch(e){}}

  function showMsg(text,color){
    msgEl.textContent=text;msgEl.style.color=color||"#fff";
    msgEl.classList.remove("show");void msgEl.offsetWidth;msgEl.classList.add("show");
  }
  function confetti(){
    var r=car.getBoundingClientRect(),em=["🎉","⭐","✨","🎊","💛"];
    for(var i=0;i<14;i++){
      var c=document.createElement("div");c.className="conf";c.textContent=em[i%em.length];
      c.style.left=(r.left+r.width/2)+"px";c.style.top=r.top+"px";
      c.style.setProperty("--dx",(Math.random()*300-150)+"px");
      c.style.setProperty("--dy",(Math.random()*-260)+"px");
      document.body.appendChild(c);
      setTimeout(function(el){return function(){el.remove()}}(c),1300);
    }
  }

  function setLane(l){
    if(l===lane)return;
    lane=l;car.style.left=(lane*50)+"%";sfxMove();
  }

  function newRound(){
    var n=order[idx];
    numEl.textContent=n;
    numEl.classList.remove("change");void numEl.offsetWidth;numEl.classList.add("change");
    var others=[6,7,8,9,10].filter(function(x){return x!==n});
    var wrongN=others[Math.floor(Math.random()*others.length)];
    correctLane=Math.random()<.5?0:1;
    var words=[];words[correctLane]=WORDS[n];words[1-correctLane]=WORDS[wrongN];
    signs.forEach(function(s,i){s.className="sign";s.firstElementChild.textContent=words[i]});
    y=-90;last=null;running=true;
    place();
    setTimeout(function(){speak(WORDS[n])},300);
  }

  function place(){signs[0].style.transform=signs[1].style.transform="translateY("+y+"px)"}

  function loop(ts){
    if(running){
      if(last===null)last=ts;
      var dt=Math.min((ts-last)/1000,.05);last=ts;
      var H=road.clientHeight;
      y+=H/4.8*dt;
      place();
      var carCenter=H-(car.getBoundingClientRect().height/2)-H*.04;
      var signH=signs[0].getBoundingClientRect().height||60;
      if(y+signH/2>=carCenter){running=false;resolve()}
    }
    requestAnimationFrame(loop);
  }

  function resolve(){
    if(lane===correctLane){
      signs[correctLane].classList.add("good");
      sfxOK();confetti();showMsg("Great! ✔","#fff");
      car.classList.remove("cheer");void car.offsetWidth;car.classList.add("cheer");
      if(!triedWrong){score++;starsEl.textContent="⭐ "+score+" / 5"}
      speak("Good job! "+WORDS[order[idx]]);
      idx++;triedWrong=false;
      setTimeout(function(){if(idx>=order.length)finish();else newRound()},1500);
    }else{
      signs[lane].classList.add("bad");signs[correctLane].classList.add("good");
      sfxBad();showMsg("Oops! Try again 🙂","#fff");
      car.classList.remove("bump");void car.offsetWidth;car.classList.add("bump");
      triedWrong=true;
      setTimeout(newRound,1600);
    }
  }

  function finish(){
    sfxWin();
    var s="";for(var i=0;i<5;i++)s+=i<score?"⭐":"☆";
    document.getElementById("endStars").textContent=s;
    document.getElementById("end").style.display="flex";
  }

  function startGame(){
    order=shuffle([6,7,8,9,10]);idx=0;score=0;triedWrong=false;
    starsEl.textContent="⭐ 0 / 5";
    document.getElementById("end").style.display="none";
    lane=-1;setLane(Math.random()<.5?0:1);
    newRound();
  }

  document.getElementById("left").addEventListener("click",function(){setLane(0)});
  document.getElementById("right").addEventListener("click",function(){setLane(1)});
  road.addEventListener("pointerdown",function(e){var r=road.getBoundingClientRect();setLane(e.clientX<r.left+r.width/2?0:1)});
  document.addEventListener("keydown",function(e){
    if(e.key==="ArrowLeft"||e.key==="a"||e.key==="A")setLane(0);
    if(e.key==="ArrowRight"||e.key==="d"||e.key==="D")setLane(1);
  });
  document.getElementById("speak").addEventListener("click",function(){if(order)speak(WORDS[order[Math.min(idx,4)]])});
  document.getElementById("startBtn").addEventListener("click",function(){
    document.getElementById("start").style.display="none";
    tone(1,.01,"sine",0,.001);
    startGame();
  });
  document.getElementById("again").addEventListener("click",startGame);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
