<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shoot cookies – Equal jars</title>
<style>
:root{--bg:#FBF3E6;--ink:#2B1A0E;--acc:#F27B21;--accd:#C4570A;--accl:#FFE2C2;--line:#F0DFC6;--ok:#2E9E5B;--bad:#D64545}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);
 font-family:'Baloo 2','Nunito',system-ui,sans-serif;font-weight:800}
.app{height:100vh;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:1.3vh;padding:1.3vh 3vw}
.top{display:flex;align-items:center;gap:3vw}
.tt{flex:1;min-width:0}
h1{margin:0;font-size:clamp(16px,3.4vh,28px);line-height:1.15}
.ins{margin:.2vh 0 0;font-size:clamp(12px,2.2vh,17px);font-weight:700}
.stars{font-size:clamp(16px,3vh,24px);letter-spacing:2px;white-space:nowrap}
.stage{--ck:min(6.5vh,8vw);display:grid;grid-template-columns:1fr auto 1fr;grid-template-rows:minmax(0,1fr) auto;gap:1vh 2vw;min-height:0}
.jar{display:flex;flex-direction:column;min-height:0}
.lid{height:max(14px,3.4vh);width:62%;margin:0 auto;background:#C4570A;border-radius:10px 10px 4px 4px}
.glass{flex:1;min-height:0;border:5px solid #9CC9E8;border-radius:14px 14px 30px 30px;background:rgba(205,235,255,.4);
 display:grid;grid-template-columns:repeat(4,1fr);align-content:end;justify-items:center;padding:1vh 1vw;overflow:hidden}
.jar.ok .glass{border-color:var(--ok);background:rgba(220,245,230,.6)}
.jar.no{animation:shake .4s}
@keyframes shake{25%{translate:-8px 0}75%{translate:8px 0}}
.ckk{font-size:var(--ck);line-height:1.05}
.ckk.pend{visibility:hidden}
.ckk.land{animation:land .3s}
@keyframes land{40%{scale:1.3}}
.jar.ok .ckk{animation:jump .5s ease 3}
@keyframes jump{40%{translate:0 -25%}}
.eq{align-self:center;font-size:min(9vh,11vw);color:var(--ok);opacity:0;transition:opacity .3s}
.eq.on{opacity:1}
.gun{grid-column:3;display:flex;flex-direction:column;align-items:center}
.cn{background:none;border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;position:relative;
 font:inherit;color:inherit}
.cn svg{height:min(13vh,26vw);width:auto;display:block}
.cn span.lb{background:var(--acc);border:3px solid var(--accd);border-radius:99px;padding:0 18px;font-size:clamp(14px,2.8vh,22px);box-shadow:0 3px 0 var(--accd)}
.cn.fire svg{animation:rec .3s}
@keyframes rec{40%{translate:0 8%;scale:1.06 .94}}
.cn[disabled]{opacity:.4;cursor:default}
#mz{position:absolute;left:50%;top:2%;width:4px;height:4px}
.fly{position:fixed;z-index:9;pointer-events:none;line-height:1}
.say{display:flex;align-items:center;gap:2vw;min-height:11vh}
.av{font-size:min(10vh,14vw);line-height:1}
.bub{flex:1;min-width:0;background:#fff;border:3px solid var(--line);border-radius:18px;padding:1vh 2vw;
 display:flex;flex-wrap:wrap;gap:.4vh 1vw;align-items:center;font-size:clamp(15px,3.2vh,28px);min-height:8vh}
.bub.bad{border-color:var(--bad);color:var(--bad)}
.w{padding:0 .45em;border-radius:10px;color:#B7A98F}
.w.said{color:var(--ink)}
.w.on{background:var(--accl);color:var(--ink)}
.rb,.nx,.ck,.un{border-radius:50%;border:3px solid var(--accd);background:var(--acc);color:var(--ink);cursor:pointer;font:inherit;
 width:max(52px,8vh);height:max(52px,8vh);font-size:clamp(20px,4vh,32px);box-shadow:0 4px 0 var(--accd);padding:0}
.un{background:#fff;border-color:var(--line);box-shadow:0 4px 0 var(--line)}
.ck{background:var(--ok);border-color:#1F7A44;color:#fff;box-shadow:0 4px 0 #1F7A44}
[hidden]{display:none!important}
button:focus-visible{outline:4px solid #345FA8;outline-offset:2px}
.end{grid-row:1/4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh;text-align:center}
.end .st{font-size:min(12vh,14vw)}
.end h2{margin:0;font-size:min(7vh,10vw)}
.big{height:max(56px,9vh);padding:0 6vw;border-radius:20px;border:4px solid var(--accd);background:var(--acc);
 color:var(--ink);font:inherit;font-size:min(5vh,7vw);cursor:pointer;box-shadow:0 5px 0 var(--accd)}
@media (prefers-reduced-motion:reduce){.jar.no,.ckk.land,.jar.ok .ckk,.cn.fire svg{animation:none}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const W=['zero','one','two','three','four','five','six','seven','eight','nine','ten'];
const N=[3,4,5,6,8];
const HINT='Bấm BẮN để bắn thêm bánh vào hũ bên phải cho bằng hũ bên trái, rồi bấm ✓.';
const app=document.getElementById('app');
let i=0,n,k0,added,locked,busy,words,spk=0;
const rand=k=>Math.floor(Math.random()*k);
const cap=s=>s[0].toUpperCase()+s.slice(1);
function say(t){try{const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.8;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
const CANNON=`<svg viewBox="0 0 120 92" xmlns="http://www.w3.org/2000/svg"><rect x="46" y="8" width="28" height="50" rx="7" fill="#F27B21" stroke="#C4570A" stroke-width="3"/><rect x="41" y="2" width="38" height="14" rx="6" fill="#C4570A"/><rect x="22" y="48" width="76" height="30" rx="14" fill="#5B7FD6" stroke="#3A5BB0" stroke-width="3"/><circle cx="48" cy="60" r="3.2" fill="#fff"/><circle cx="72" cy="60" r="3.2" fill="#fff"/><path d="M52 67 Q60 73 68 67" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="38" cy="80" r="11" fill="#444"/><circle cx="38" cy="80" r="4" fill="#bbb"/><circle cx="82" cy="80" r="11" fill="#444"/><circle cx="82" cy="80" r="4" fill="#bbb"/></svg>`;

function cookies(c,pend){return Array.from({length:c},(_,k)=>`<span class="ckk${pend&&k===c-1?' pend':''}">🍪</span>`).join('')}
function newRound(){
 n=N[i];k0=1+rand(n-2);added=0;locked=false;busy=false;
 words=[cap(W[n]),'is equal to',W[n]+'.'];
 const stars=N.map((_,k)=>k<i?'⭐':'☆').join('');
 app.innerHTML=`<div class="top"><div class="tt"><h1>Shoot cookies into the jar to make them equal</h1><p class="ins">Bắn thêm bánh vào hũ bên phải cho bằng hũ bên trái nhé!</p></div><div class="stars">${stars}</div></div>
 <div class="stage">
  <div class="jar" id="jl"><div class="lid"></div><div class="glass">${cookies(n)}</div></div>
  <div class="eq" id="eq">=</div>
  <div class="jar" id="jr"><div class="lid"></div><div class="glass" id="gr">${cookies(k0)}</div></div>
  <div class="gun"><button class="cn" id="cn" aria-label="bắn">${CANNON}<span id="mz"></span><span class="lb">BẮN!</span></button></div>
 </div>
 <div class="say"><span class="av">🐻</span><div class="bub" id="bub">${HINT}</div>
  <button class="un" id="un" aria-label="lấy bớt">↩</button><button class="ck" id="ck" aria-label="check">✓</button>
  <button class="rb" id="rb" hidden aria-label="listen again">🔊</button><button class="nx" id="nx" hidden aria-label="next">➜</button></div>`;
 document.getElementById('cn').onclick=shoot;
 document.getElementById('un').onclick=undo;
 document.getElementById('ck').onclick=check;
 document.getElementById('rb').onclick=()=>speakSeq();
 document.getElementById('nx').onclick=()=>{spk++;try{speechSynthesis.cancel()}catch(e){}i++;i>=N.length?end():newRound()};
}
function bub(t,bad){const b=document.getElementById('bub');b.className='bub'+(bad?' bad':'');b.textContent=t}
function total(){return k0+added}
function shoot(){
 if(locked||busy)return;
 if(total()>=10){bub('Hũ đầy rồi! Bấm ↩ để lấy bớt.',true);return}
 busy=true;added++;
 const gr=document.getElementById('gr');gr.innerHTML=cookies(total(),true);
 const t=gr.querySelector('.pend'),cn=document.getElementById('cn');
 cn.classList.add('fire');setTimeout(()=>cn.classList.remove('fire'),300);
 const done=()=>{if(t.isConnected){t.classList.remove('pend');t.classList.add('land')}busy=false;say(W[total()]);
  const b=document.getElementById('bub');if(b&&b.classList.contains('bad'))bub(HINT)};
 try{
  const sr=document.getElementById('mz').getBoundingClientRect(),tr=t.getBoundingClientRect();
  const sx=sr.left+sr.width/2,sy=sr.top+sr.height/2,dx=tr.left+tr.width/2-sx,dy=tr.top+tr.height/2-sy;
  const f=document.createElement('span');f.className='fly';f.textContent='🍪';
  f.style.cssText=`left:${sx}px;top:${sy}px;font-size:${getComputedStyle(t).fontSize}`;
  document.body.appendChild(f);
  const a=f.animate([
   {transform:'translate(-50%,-50%) translate(0px,0px) scale(.5) rotate(0deg)'},
   {transform:`translate(-50%,-50%) translate(${dx*.5}px,${dy*.5-50}px) scale(1.1) rotate(180deg)`,offset:.55},
   {transform:`translate(-50%,-50%) translate(${dx}px,${dy}px) scale(1) rotate(360deg)`}
  ],{duration:650,easing:'ease-in-out',fill:'forwards'});
  a.onfinish=()=>{f.remove();done()};
 }catch(e){done()}
}
function undo(){
 if(locked||busy||added===0)return;
 added--;document.getElementById('gr').innerHTML=cookies(total());bub(HINT);
}
function wrong(t){
 bub(t,true);
 const p=document.getElementById('jr');p.classList.remove('no');void p.offsetWidth;p.classList.add('no');
}
function check(){
 if(locked||busy)return;
 const c=total();
 if(c>n)return wrong('Nhiều hơn rồi! Bấm ↩ để lấy bớt nhé.');
 if(c<n)return wrong('Chưa bằng! Bắn thêm bánh nhé.');
 success();
}
function success(){
 locked=true;
 document.getElementById('jl').classList.add('ok');document.getElementById('jr').classList.add('ok');
 document.getElementById('eq').classList.add('on');
 document.getElementById('cn').disabled=true;
 ['ck','un'].forEach(id=>document.getElementById(id).hidden=true);
 document.getElementById('rb').hidden=false;
 const b=document.getElementById('bub');b.className='bub';
 b.innerHTML=words.map((t,k)=>`<span class="w" data-k="${k}">${t}</span>`).join('');
 speakSeq();
}
function mark(idx){document.querySelectorAll('.w[data-k]').forEach(e=>{const k=+e.dataset.k;e.className='w'+(k<idx?' said':k===idx?' on':'')})}
function speakSeq(){
 const id=++spk;let k=0;
 try{speechSynthesis.cancel()}catch(e){}
 const next=()=>{
  if(id!==spk)return;
  if(k>=words.length){mark(99);document.getElementById('nx').hidden=false;return}
  const idx=k++;mark(idx);let fired=false;
  const go=()=>{if(fired)return;fired=true;setTimeout(next,150)};
  try{const u=new SpeechSynthesisUtterance(words[idx].replace('.',''));u.lang='en-US';u.rate=.75;u.onend=go;u.onerror=go;speechSynthesis.speak(u)}catch(e){}
  setTimeout(go,2200);
 };
 next();
}
function end(){
 app.innerHTML=`<div class="end"><div class="st">🍪🐻🍪</div><h2>Giỏi quá! Great job!</h2><button class="big" id="again">Chơi lại</button></div>`;
 document.getElementById('again').onclick=()=>{i=0;newRound()};
}
newRound();
</script>
</body>
</html>
