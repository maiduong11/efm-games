<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Extension 1.2 – Fill the jar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
<style>
:root{
  --bg:#eaf6f1;--card:#ffffff;--ink:#23403a;--water:#4aa8ff;--ok:#2fb36b;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#16302b;--card:#1f3d37;--ink:#eaf6f1;}
}
:root[data-theme="dark"]{--bg:#16302b;--card:#1f3d37;--ink:#eaf6f1;}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:10px}
h1{margin:0;font-size:clamp(20px,5vw,30px);font-weight:800;text-align:center}
#stars{font-size:clamp(18px,4vw,24px);letter-spacing:3px}
#stage{container-type:inline-size;--u:7cqw;width:min(94vw,440px);background:var(--card);border-radius:6cqw;padding:4cqw 4cqw 5cqw}
#top{height:calc(5*var(--u) + 4cqw);display:flex;align-items:flex-end;justify-content:center}
#beaker{position:relative;width:32cqw;height:calc(var(--n)*var(--u));border:1.2cqw solid var(--ink);border-top:0;border-radius:0 0 4cqw 4cqw;background:rgba(74,168,255,.08);margin-right:6cqw}
#water{position:absolute;left:0;right:0;bottom:0;height:calc(var(--lvl)*var(--u));background:var(--water);border-radius:0 0 2.6cqw 2.6cqw;transition:height .7s ease-in-out,background .3s}
#beaker.full #water{background:var(--ok)}
#beaker.shake{animation:shake .4s}
#cells{position:absolute;inset:0;display:flex;flex-direction:column-reverse}
#cells .cell{height:var(--u);border-top:.5cqw dashed rgba(35,64,58,.45);position:relative}
#cells .cell span{position:absolute;left:100%;margin-left:2cqw;top:0;line-height:var(--u);font-size:5cqw;font-weight:800}
#shelf{display:flex;justify-content:center;align-items:flex-end;gap:4cqw;margin-top:5cqw;height:calc(4*var(--u) + 2cqw)}
.bottle{position:relative;width:17cqw;height:calc(var(--m)*var(--u));padding:0;background:var(--water);border:1cqw solid var(--ink);border-radius:2.4cqw;cursor:pointer;display:flex;flex-direction:column-reverse;transform-origin:50% 100%;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.bottle .cell{height:var(--u);flex:none;border-top:.5cqw solid rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.95);font-size:4.4cqw;font-weight:800}
.bottle .cell:last-child{border-top:0}
.bottle:focus-visible{outline:.8cqw solid var(--ink);outline-offset:1cqw}
.bottle.pour{animation:pour 1s ease-in-out}
@keyframes pour{0%{transform:none}30%,70%{transform:translateY(-6cqw) rotate(-18deg)}100%{transform:none}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-2cqw)}50%{transform:translateX(2cqw)}75%{transform:translateX(-1.4cqw)}}
#win{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
#win.show{display:flex}
#win div{background:var(--card);border-radius:28px;padding:28px 34px;text-align:center}
#win h2{margin:0 0 6px;font-size:clamp(28px,7vw,44px)}
#win p{margin:0 0 14px;font-size:clamp(34px,9vw,56px)}
button.again{font:inherit;font-weight:800;font-size:24px;border:0;border-radius:16px;padding:10px 28px;background:var(--ok);color:#fff;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.2)}
@media (prefers-reduced-motion:reduce){.bottle.pour,#beaker.shake{animation:none}#water{transition:none}}
</style>
</head>
<body>
<h1>Fill the jar</h1>
<div id="stars" aria-live="polite">☆☆☆☆☆☆</div>
<div id="stage">
  <div id="top"><div id="beaker"><div id="water"></div><div id="cells"></div></div></div>
  <div id="shelf"></div>
</div>
<div id="win" role="dialog" aria-live="polite"><div><h2>Well done!</h2><p>⭐⭐⭐</p><button class="again" id="again">Play again</button></div></div>

<script>
// [marks on the jar, marks of water already in it]: the jar always starts from 2-5 marks.
const ROUNDS=[[2,1],[3,2],[3,1],[4,3],[4,1],[5,2]];
const beaker=document.getElementById('beaker'),cells=document.getElementById('cells'),
      shelf=document.getElementById('shelf'),stars=document.getElementById('stars');
let round=0,n=2,k=1,lock=false,ac=null;

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function tone(freqs,dur){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    freqs.forEach((f,i)=>{
      const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*dur;
      o.frequency.value=f;o.type='sine';o.connect(g);g.connect(ac.destination);
      g.gain.setValueAtTime(.2,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
      o.start(t);o.stop(t+dur);
    });
  }catch(e){}
}

function buildShelf(){
  shelf.innerHTML='';
  for(let m=1;m<=4;m++){
    const b=document.createElement('button');
    b.className='bottle';b.style.setProperty('--m',m);
    b.setAttribute('aria-label',m+' mark'+(m>1?'s':''));
    for(let i=1;i<=m;i++){const c=document.createElement('div');c.className='cell';b.appendChild(c);}
    b.onclick=()=>pour(b,m);
    shelf.appendChild(b);
  }
}

function startRound(){
  [n,k]=ROUNDS[round];lock=false;
  beaker.classList.remove('full','shake');
  beaker.style.setProperty('--n',n);
  beaker.style.setProperty('--lvl',k);
  cells.innerHTML='';
  for(let i=1;i<=n;i++){const c=document.createElement('div');c.className='cell';c.innerHTML='<span>'+i+'</span>';cells.appendChild(c);}
}

async function pour(b,m){
  if(lock)return;lock=true;
  b.classList.add('pour');
  await sleep(350);
  beaker.style.setProperty('--lvl',Math.min(k+m,n));
  tone([520,600],.15);
  await sleep(1000);
  b.classList.remove('pour');
  if(k+m===n){
    beaker.classList.add('full');
    tone([660,880,1100],.12);
    stars.textContent='⭐'.repeat(round+1)+'☆'.repeat(5-round);
    await sleep(1500);
    round++;
    if(round===ROUNDS.length){tone([523,659,784,1047],.18);document.getElementById('win').classList.add('show');}
    else startRound();
  }else{
    // wrong bottle: the water drains back, no penalty
    tone([220],.2);beaker.classList.add('shake');
    await sleep(450);beaker.classList.remove('shake');
    beaker.style.setProperty('--lvl',k);
    await sleep(800);
    lock=false;
  }
}

function newGame(){
  round=0;stars.textContent='☆☆☆☆☆☆';
  document.getElementById('win').classList.remove('show');
  startRound();
}
document.getElementById('again').onclick=newGame;
buildShelf();newGame();
</script>
</body>
</html>
