<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Practice 2.2 – Balloon pop</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
<style>
:root{
  --bg:#eaf6f1;--card:#ffffff;--ink:#23403a;--word:#3b8fe0;--ok:#2fb36b;
  --sky1:#bfe6ff;--sky2:#e9f7ff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#16302b;--card:#1f3d37;--ink:#eaf6f1;--sky1:#27567a;--sky2:#3a7099;}
}
:root[data-theme="dark"]{--bg:#16302b;--card:#1f3d37;--ink:#eaf6f1;--sky1:#27567a;--sky2:#3a7099;}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:10px}
h1{margin:0;font-size:clamp(20px,5vw,30px);font-weight:800;text-align:center}
#stars{font-size:clamp(18px,4vw,24px);letter-spacing:3px}
#wrap{width:min(94vw,440px,calc((100vh - 230px)*.8))}
#prompt{width:100%;border-radius:22px;background:var(--word);color:#fff;display:flex;align-items:center;justify-content:center;gap:16px;padding:6px 14px;margin-bottom:8px;box-shadow:0 5px 0 rgba(0,0,0,.2);transition:background .3s;font-weight:800}
#prompt b{font-size:clamp(40px,11vw,60px);line-height:1.1}
#prompt .ans{font-size:clamp(26px,7vw,38px);font-weight:600}
#prompt.ok{background:var(--ok)}
#stage{container-type:inline-size;position:relative;width:100%;aspect-ratio:4/5;overflow:hidden;border-radius:24px;background:linear-gradient(var(--sky1),var(--sky2))}
.ball{position:absolute;bottom:0;width:22cqw;height:28cqw;margin-left:-11cqw;border:0;background:none;padding:0;cursor:pointer;will-change:transform;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.ball::after{content:"";position:absolute;left:50%;top:100%;width:.6cqw;height:9cqw;background:rgba(0,0,0,.35)}
.ball .body{display:flex;align-items:center;justify-content:center;width:100%;height:100%;background:var(--c);color:#fff;font-size:13cqw;font-weight:800;border-radius:50% 50% 50% 50%/58% 58% 42% 42%;box-shadow:inset -2cqw -2cqw 0 rgba(0,0,0,.12),inset 2cqw 2cqw 0 rgba(255,255,255,.25)}
.ball:focus-visible{outline:.8cqw solid var(--ink)}
.ball.bad .body{animation:shake .4s}
.ball.pop .body{animation:pop .45s forwards}
.ball.pop::after{display:none}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-2cqw)}50%{transform:translateX(2cqw)}75%{transform:translateX(-1.4cqw)}}
@keyframes pop{to{transform:scale(1.6);opacity:0}}
#win{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
#win.show{display:flex}
#win div{background:var(--card);border-radius:28px;padding:28px 34px;text-align:center}
#win h2{margin:0 0 6px;font-size:clamp(28px,7vw,44px)}
#win p{margin:0 0 14px;font-size:clamp(34px,9vw,56px)}
button.again{font:inherit;font-weight:800;font-size:24px;border:0;border-radius:16px;padding:10px 28px;background:var(--ok);color:#fff;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.2)}
@media (prefers-reduced-motion:reduce){.ball.bad .body{animation:none}}
</style>
</head>
<body>
<h1>Balloon pop</h1>
<div id="stars" aria-live="polite">☆☆☆☆☆☆</div>
<div id="wrap">
  <div id="prompt"><b id="word"></b><span class="ans" id="ans"></span></div>
  <div id="stage"></div>
</div>
<div id="win" role="dialog" aria-live="polite"><div><h2>Well done!</h2><p>⭐⭐⭐</p><button class="again" id="again">Play again</button></div></div>

<script>
const WORDS=['zero','one','two','three','four','five'];
const COLORS=['#e63946','#f4a261','#2a9d8f','#8e6bd8','#3b8fe0','#e76f9a'];
const XS=[14,38,62,86];
const stage=document.getElementById('stage'),prompt_=document.getElementById('prompt'),
      wordEl=document.getElementById('word'),ansEl=document.getElementById('ans'),stars=document.getElementById('stars');
const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
let order=[],round=0,target=0,balls=[],lock=false,ac=null,last=0;

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
function tone(freqs,dur){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    freqs.forEach((f,i)=>{
      const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*dur;
      o.frequency.value=f;o.type='sine';o.connect(g);g.connect(ac.destination);
      g.gain.setValueAtTime(.2,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
      o.start(t);o.stop(t+dur);
    });
  }catch(e){}
}

function startRound(){
  target=order[round];lock=false;
  wordEl.textContent=WORDS[target];ansEl.textContent='';prompt_.classList.remove('ok');
  balls.forEach(b=>b.el.remove());balls=[];
  const W=stage.clientWidth,H=stage.clientHeight,u=W/100;
  const digits=shuffle([target,...shuffle([0,1,2,3,4,5].filter(k=>k!==target)).slice(0,3)]);
  const cols=shuffle(COLORS);
  digits.forEach((d,i)=>{
    const el=document.createElement('button');
    el.className='ball';el.style.left=XS[i]+'%';el.style.setProperty('--c',cols[i]);
    el.innerHTML='<span class="body">'+d+'</span>';
    el.setAttribute('aria-label','number '+d);
    el.onclick=()=>tap(el,d);
    stage.appendChild(el);
    // spread the balloons at different heights so they never bunch up
    const y=still?H*(0.1+i*0.2):(i*.25+Math.random()*.08)*H;
    balls.push({el,y,v:H/22*(0.85+Math.random()*.3)});
  });
}

function frame(t){
  const dt=Math.min((t-last)/1000||0,.05);last=t;
  if(!still){
    const H=stage.clientHeight,u=stage.clientWidth/100;
    balls.forEach(b=>{
      b.y+=b.v*dt;
      if(b.y>H)b.y=-37*u;           // floats off the top, re-enters from the bottom
    });
  }
  balls.forEach(b=>b.el.style.transform='translateY('+(-b.y)+'px)');
  requestAnimationFrame(frame);
}

async function tap(el,d){
  if(lock)return;
  if(d===target){
    lock=true;el.classList.add('pop');tone([660,880,1100],.12);
    ansEl.textContent='= '+target;prompt_.classList.add('ok');
    stars.textContent='⭐'.repeat(round+1)+'☆'.repeat(5-round);
    await sleep(1500);
    round++;
    if(round===6){tone([523,659,784,1047],.18);document.getElementById('win').classList.add('show');}
    else startRound();
  }else{
    tone([220],.2);el.classList.add('bad');
    setTimeout(()=>el.classList.remove('bad'),420);
  }
}

function newGame(){
  order=shuffle([0,1,2,3,4,5]);round=0;
  stars.textContent='☆☆☆☆☆☆';
  document.getElementById('win').classList.remove('show');
  startRound();
}
document.getElementById('again').onclick=newGame;
newGame();
requestAnimationFrame(frame);
</script>
</body>
</html>
