<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Look, write and say – Equal to</title>
    <style>
        :root {
            --bg: #FBF3E6;
            --ink: #2B1A0E;
            --acc: #F27B21;
            --accd: #C4570A;
            --accl: #FFE2C2;
            --line: #F0DFC6;
            --ok: #2E9E5B
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: var(--bg);
            color: var(--ink);
            font-family: 'Baloo 2', 'Nunito', system-ui, sans-serif;
            font-weight: 800
        }

        body.emb {
            background: transparent
        }

        /* ===== THẺ NGOÀI (giống thẻ hoạt động của website) ===== */
        .page {
            height: 100%;
            padding: 1.6vh 2vw
        }

        .card {
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 1.4vh;
            background: #fff;
            border: 2px solid var(--line);
            border-radius: 28px;
            padding: 1.8vh 2vw
        }

        .hd {
            display: flex;
            align-items: center;
            gap: 2vw
        }

        .tt {
            flex: 1;
            min-width: 0
        }

        h2 {
            margin: 0;
            font-size: clamp(20px, 4vh, 30px);
            line-height: 1.15
        }

        .ins {
            margin: .3vh 0 0;
            font-size: clamp(12px, 2.4vh, 16px);
            font-weight: 600;
            color: #6B4E36
        }

        .stars {
            font-size: clamp(16px, 3vh, 24px);
            letter-spacing: 2px;
            white-space: nowrap
        }

        .emb .page {
            padding: 0
        }

        .emb .card {
            border: 0;
            background: none;
            padding: 0
        }

        .emb .hd {
            display: none
        }

        /* ===== KHUNG GAME BÊN TRONG ===== */
        .gbox {
            flex: 1;
            min-height: 0;
            border-radius: 24px;
            background: #FFF4E4;
            padding: 1.4vh 1.4vw;
            display: grid;
            grid-template-rows: minmax(0, 1fr) auto auto;
            gap: 1.2vh
        }

        /* ===== SCENE: công viên + bập bênh ===== */
        .scene {
            position: relative;
            min-height: 0;
            overflow: hidden;
            border: 4px solid var(--line);
            border-radius: 22px;
            background: linear-gradient(#BDE5F6, #E8F7FC 62%);
            --ph: min(9vh, 12vw)
        }

        .sun {
            position: absolute;
            left: 4%;
            top: 6%;
            width: min(12vh, 14vw)
        }

        .sun .ry {
            transform-origin: 50px 50px;
            animation: spin 16s linear infinite
        }

        .cl {
            position: absolute;
            left: 0;
            top: var(--t);
            width: var(--w);
            height: calc(var(--w)*.34);
            background: #fff;
            border-radius: 99px;
            animation: drift var(--s) linear infinite
        }

        .cl::before,
        .cl::after {
            content: '';
            position: absolute;
            background: #fff;
            border-radius: 50%
        }

        .cl::before {
            left: 16%;
            top: -48%;
            width: 40%;
            height: 112%
        }

        .cl::after {
            left: 46%;
            top: -30%;
            width: 32%;
            height: 90%
        }

        .hill {
            position: absolute;
            border-radius: 50% 50% 0 0
        }

        .h1 {
            left: -10%;
            width: 70%;
            bottom: 30%;
            height: 24%;
            background: #B7E39A
        }

        .h2 {
            right: -15%;
            width: 75%;
            bottom: 30%;
            height: 17%;
            background: #A5DB86
        }

        .tree {
            position: absolute;
            bottom: 26%;
            height: 34%;
            aspect-ratio: 80/110;
            transform-origin: 50% 100%;
            animation: sway 4s ease-in-out infinite alternate
        }

        .gr {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 34%;
            background: #9AD37A;
            border-top: 6px solid #86C468
        }

        .fl {
            position: absolute;
            left: var(--l);
            bottom: var(--b);
            font-size: min(3.4vh, 3vw);
            line-height: 1;
            transform-origin: 50% 100%;
            animation: sway 3s ease-in-out infinite alternate
        }

        .bf {
            position: absolute;
            left: 0;
            top: 30%;
            font-size: min(4vh, 4vw);
            pointer-events: none;
            animation: fly 14s linear infinite
        }

        .sw {
            position: absolute;
            inset: 0;
            pointer-events: none
        }

        .piv {
            position: absolute;
            left: 50%;
            bottom: 5%;
            width: calc(var(--ph)*1.15);
            height: var(--ph);
            transform: translateX(-50%)
        }

        .plank {
            position: absolute;
            left: 3%;
            right: 3%;
            bottom: calc(5% + var(--ph) - 7px);
            display: flex;
            transform-origin: 50% calc(100% - 7px);
            animation: enter .6s ease-out, wob 2.8s ease-in-out .6s infinite
        }

        .beam {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 14px;
            border-radius: 9px;
            background: #E39A45;
            border-bottom: 4px solid #B8641C
        }

        .half {
            flex: 1;
            display: flex;
            align-items: flex-end;
            padding: 0 1% 12px
        }

        .half.l {
            justify-content: flex-end;
            --dir: 1
        }

        .half.r {
            justify-content: flex-start;
            --dir: -1
        }

        .it {
            flex: none;
            font-size: min(8vh, 5.4vw);
            line-height: 1;
            padding: 0 .08em;
            transform-origin: 50% 100%;
            animation: peek 1.8s ease-in-out var(--d) infinite
        }

        .plank.done .it {
            animation: none
        }

        .plank.done .it.hp {
            animation: pairhop .55s ease var(--dl) 1
        }

        .plank.done.bump .it {
            animation: bump .45s ease
        }

        #sv {
            position: absolute;
            left: 0;
            top: 0;
            overflow: visible;
            pointer-events: none
        }

        #sv path {
            fill: none;
            stroke-width: 5;
            stroke-linecap: round;
            stroke-dasharray: 1;
            stroke-dashoffset: 1;
            animation: draw .45s ease both
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        @keyframes drift {
            from {
                transform: translateX(-25vw)
            }

            to {
                transform: translateX(105vw)
            }
        }

        @keyframes sway {
            from {
                transform: rotate(-2.5deg)
            }

            to {
                transform: rotate(2.5deg)
            }
        }

        @keyframes fly {
            0% {
                transform: translate(-5vw, 0)
            }

            25% {
                transform: translate(25vw, -6vh)
            }

            50% {
                transform: translate(55vw, 2vh)
            }

            75% {
                transform: translate(80vw, -5vh)
            }

            100% {
                transform: translate(105vw, 0)
            }
        }

        @keyframes enter {
            from {
                transform: translateX(115%)
            }

            to {
                transform: none
            }
        }

        @keyframes wob {

            0%,
            100% {
                transform: rotate(0)
            }

            25% {
                transform: rotate(-6deg)
            }

            75% {
                transform: rotate(6deg)
            }
        }

        @keyframes leave {
            0% {
                transform: rotate(0)
            }

            20% {
                transform: rotate(-5deg)
            }

            40% {
                transform: rotate(4deg)
            }

            100% {
                transform: translateX(-115%)
            }
        }

        @keyframes rum {
            25% {
                rotate: -1.4deg
            }

            75% {
                rotate: 1.4deg
            }
        }

        @keyframes peek {

            0%,
            100% {
                transform: rotate(0)
            }

            50% {
                transform: rotate(calc(var(--dir)*9deg))
            }
        }

        @keyframes pairhop {
            50% {
                translate: calc(var(--dir)*30%) -50%;
                scale: 1.15
            }
        }

        @keyframes bump {
            40% {
                translate: 0 -30%;
                scale: 1.12
            }
        }

        @keyframes draw {
            from {
                stroke-dashoffset: 1
            }

            to {
                stroke-dashoffset: 0
            }
        }

        /* ===== TRACE + SAY ===== */
        .tr {
            position: relative;
            height: min(21vh, 170px);
            background: #fff;
            border: 4px solid var(--line);
            border-radius: 22px;
            overflow: hidden
        }

        .tr.ok {
            background: #EAF7EF;
            border-color: var(--ok)
        }

        canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            touch-action: none
        }

        .er {
            position: absolute;
            right: 8px;
            top: 8px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid var(--line);
            background: #fff;
            color: var(--ink);
            font-size: 18px;
            cursor: pointer;
            padding: 0;
            z-index: 2
        }

        .say {
            display: flex;
            align-items: center;
            gap: 2vw;
            min-height: 9vh
        }

        .dog {
            position: relative;
            margin-right: .4em;
            font-size: min(8.5vh, 12vw);
            line-height: 1
        }

        .dog.happy {
            animation: hop .5s 3
        }

        @keyframes hop {
            50% {
                translate: 0 -14%
            }
        }

        .clap {
            position: absolute;
            right: -.45em;
            top: .1em;
            font-size: .5em;
            font-style: normal;
            opacity: 0
        }

        .dog.clp .clap {
            opacity: 1;
            animation: clap .35s ease-in-out infinite alternate
        }

        @keyframes clap {
            from {
                transform: scale(.8) rotate(-12deg)
            }

            to {
                transform: scale(1.15) rotate(12deg)
            }
        }

        .bub {
            flex: 1;
            min-width: 0;
            background: #fff;
            border: 3px solid var(--line);
            border-radius: 18px;
            padding: .8vh 2vw;
            display: flex;
            flex-wrap: wrap;
            gap: .4vh 1vw;
            align-items: center;
            font-size: clamp(15px, 3.2vh, 28px);
            min-height: 7vh
        }

        .w {
            padding: 0 .45em;
            border-radius: 10px;
            color: #B7A98F
        }

        .w.said {
            color: var(--ink)
        }

        .w.on {
            background: var(--accl);
            color: var(--ink)
        }

        .rb,
        .nx {
            border-radius: 50%;
            border: 3px solid var(--accd);
            background: var(--acc);
            color: var(--ink);
            cursor: pointer;
            font: inherit;
            width: max(48px, 7vh);
            height: max(48px, 7vh);
            font-size: clamp(18px, 3.6vh, 30px);
            box-shadow: 0 4px 0 var(--accd);
            padding: 0
        }

        .rb[hidden],
        .nx[hidden] {
            display: none
        }

        button:focus-visible {
            outline: 4px solid #345FA8;
            outline-offset: 2px
        }

        .end {
            grid-row: 1/4;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3vh;
            text-align: center
        }

        .end .st {
            font-size: min(12vh, 14vw)
        }

        .end h2 {
            font-size: min(7vh, 10vw)
        }

        .big {
            height: max(56px, 9vh);
            padding: 0 6vw;
            border-radius: 20px;
            border: 4px solid var(--accd);
            background: var(--acc);
            color: var(--ink);
            font: inherit;
            font-size: min(5vh, 7vw);
            cursor: pointer;
            box-shadow: 0 5px 0 var(--accd)
        }

        @media (prefers-reduced-motion:reduce) {
            * {
                animation: none !important;
                transition: none !important
            }

            #sv path {
                stroke-dashoffset: 0
            }
        }
    </style>
</head>

<body>
    <div class="page">
        <section class="card">
            <div class="hd">
                <div class="tt">
                    <h2>Look, write and say</h2>
                    <p class="ins">Đếm các bạn thú ở hai đầu bập bênh. Tô theo số mờ rồi đọc to nhé!</p>
                </div>
                <div class="stars" id="stars"></div>
            </div>
            <div class="gbox" id="app"></div>
        </section>
    </div>
    <script>
        if (new URLSearchParams(location.search).has('embed')) document.body.classList.add('emb');
        const W = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten'];
        const R = [
            { n: 3, a: '🐻', b: '🐷' },
            { n: 2, a: '🐭', b: '🐰' },
            { n: 5, a: '🐥', b: '🦆' },
            { n: 4, a: '🐸', b: '🐢' },
            { n: 6, a: '🐵', b: '🐼' }
        ];
        const C = ['#F27B21', '#3E9E8C', '#4A7BD0', '#B97AD9', '#E0567A', '#2E9BB5'];
        const app = document.getElementById('app'), t0 = performance.now();
        let i = 0, ok, step, spk = 0, words, AC, tm = [];
        const cap = s => s[0].toUpperCase() + s.slice(1);
        const later = (f, ms) => { tm.push(setTimeout(f, ms)) };
        const clearT = () => { tm.forEach(clearTimeout); tm = [] };
        const setStars = () => { document.getElementById('stars').textContent = R.map((_, k) => k < i ? '⭐' : '☆').join('') };

        /* ---------- âm thanh (Web Audio) ---------- */
        function ac() { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume() } catch (e) { } }
        function tn(f, t, d, type, g, f2) {
            if (!AC) return; const o = AC.createOscillator(), v = AC.createGain();
            o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
            v.gain.setValueAtTime(.0001, t); v.gain.exponentialRampToValueAtTime(g, t + .02); v.gain.exponentialRampToValueAtTime(.0001, t + d);
            o.connect(v); v.connect(AC.destination); o.start(t); o.stop(t + d + .05);
        }
        function pop(k) { if (AC) tn(520 + k * 90, AC.currentTime, .18, 'triangle', .1) }
        function boing() { if (!AC) return; const t = AC.currentTime; tn(180, t, .5, 'sine', .2, 520); tn(520, t + .5, .4, 'sine', .12, 260) }

        /* ---------- dựng cảnh ---------- */
        const tree = s => `<svg class="tree" style="${s}" viewBox="0 0 80 110"><rect x="34" y="58" width="12" height="52" rx="4" fill="#B9783A"/><circle cx="40" cy="36" r="30" fill="#5DB36B"/><circle cx="22" cy="54" r="19" fill="#6CC27A"/><circle cx="58" cy="52" r="19" fill="#4FA860"/></svg>`;
        const row = (e, n) => Array.from({ length: n }, () => `<span class="it" style="--d:${(Math.random() * 1.5).toFixed(2)}s">${e}</span>`).join('');
        function scene(r, el) {
            return `<div class="scene">
 <svg class="sun" viewBox="0 0 100 100"><g class="ry"><circle cx="50" cy="50" r="38" fill="none" stroke="#FFC933" stroke-width="9" stroke-dasharray="6 23.85" stroke-linecap="round"/></g><circle cx="50" cy="50" r="25" fill="#FFD54A"/><circle cx="41" cy="46" r="3" fill="#2B1A0E"/><circle cx="59" cy="46" r="3" fill="#2B1A0E"/><path d="M41 57Q50 66 59 57" fill="none" stroke="#2B1A0E" stroke-width="3" stroke-linecap="round"/></svg>
 <i class="cl" style="--t:8%;--w:15vw;--s:75s;animation-delay:-${(el + 10).toFixed(1)}s"></i>
 <i class="cl" style="--t:22%;--w:11vw;--s:55s;animation-delay:-${(el + 30).toFixed(1)}s"></i>
 <i class="hill h1"></i><i class="hill h2"></i>
 ${tree('left:3%')}${tree('right:5%;height:28%')}
 <div class="gr"></div>
 <span class="fl" style="--l:6%;--b:8%">🌼</span><span class="fl" style="--l:22%;--b:17%">🌷</span>
 <span class="fl" style="--l:40%;--b:3%">🌼</span><span class="fl" style="--l:60%;--b:15%">🌷</span>
 <span class="fl" style="--l:80%;--b:6%">🌼</span><span class="fl" style="--l:92%;--b:16%">🌷</span>
 <div class="sw">
  <svg class="piv" viewBox="0 0 100 90"><path d="M50 8L92 84H8Z" fill="#F2B56B" stroke="#B8641C" stroke-width="6" stroke-linejoin="round"/><circle cx="50" cy="14" r="8" fill="#B8641C"/></svg>
  <div class="plank" id="pl"><div class="half l">${row(r.a, r.n)}</div><div class="half r">${row(r.b, r.n)}</div><div class="beam"></div><svg id="sv"></svg></div>
 </div>
 <span class="bf">🦋</span>
</div>`;
        }

        function newRound() {
            clearT();
            const r = R[i]; ok = [false, false, false]; step = 'trace';
            words = [cap(W[r.n]), 'is equal to', W[r.n] + '.'];
            const el = (performance.now() - t0) / 1000;
            setStars();
            app.innerHTML = `${scene(r, el)}
 <div class="tr" id="tr"><canvas id="gh"></canvas><canvas id="ink"></canvas><button class="er" id="er" aria-label="erase">↺</button></div>
 <div class="say"><span class="dog" id="dog">🐶<i class="clap">👏</i></span><div class="bub" id="bub"><span class="w said">Tô ${r.n} = ${r.n}</span></div>
 <button class="rb" id="rb" hidden aria-label="listen again">🔊</button><button class="nx" id="nx" hidden aria-label="next">➜</button></div>`;
            document.getElementById('er').onclick = clearInk;
            document.getElementById('rb').onclick = () => speakSeq();
            document.getElementById('nx').onclick = nextRound;
            setupCanvas();
        }
        function nextRound() {
            const nx = document.getElementById('nx'), pl = document.getElementById('pl');
            nx.disabled = true; try { speechSynthesis.cancel() } catch (e) { }
            spk++; clearT();
            pl.style.transition = 'none'; pl.style.animation = 'leave .8s ease-in forwards';
            later(() => { i++; i >= R.length ? end() : newRound() }, 780);
        }

        /* ---------- tô số ---------- */
        function glyphs() { return [String(R[i].n), '=', String(R[i].n)] }
        function paintGhost() {
            const gh = document.getElementById('gh'); if (!gh) return;
            const dpr = window.devicePixelRatio || 1, w = gh.width / dpr, h = gh.height / dpr, g = gh.getContext('2d');
            g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
            g.font = `800 ${h * .8}px 'Baloo 2','Nunito',Arial,sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
            glyphs().forEach((t, k) => { g.fillStyle = ok[k] ? '#2E9E5B' : '#DCCFB9'; g.fillText(t, w * [.2, .5, .8][k], h * .56) });
        }
        function setupCanvas() {
            const tr = document.getElementById('tr'); if (!tr) return;
            const dpr = window.devicePixelRatio || 1, w = tr.clientWidth, h = tr.clientHeight;
            const gh = document.getElementById('gh'), ink = document.getElementById('ink');
            [gh, ink].forEach(c => { c.width = Math.round(w * dpr); c.height = Math.round(h * dpr) });
            paintGhost();
            const k = ink.getContext('2d'); k.setTransform(dpr, 0, 0, dpr, 0, 0);
            k.lineCap = 'round'; k.lineJoin = 'round'; k.lineWidth = h * .1; k.strokeStyle = '#F27B21';
            let on = false, lx = 0, ly = 0;
            const pos = e => { const b = ink.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top] };
            ink.onpointerdown = e => { if (step !== 'trace') return; ac(); on = true; ink.setPointerCapture(e.pointerId);[lx, ly] = pos(e); k.beginPath(); k.moveTo(lx, ly); k.lineTo(lx + .01, ly); k.stroke() };
            ink.onpointermove = e => { if (!on) return; const [x, y] = pos(e); k.beginPath(); k.moveTo(lx, ly); k.lineTo(x, y); k.stroke(); lx = x; ly = y };
            ink.onpointerup = ink.onpointercancel = () => { if (!on) return; on = false; evaluate() };
        }
        function clearInk() {
            const ink = document.getElementById('ink'); if (!ink || step !== 'trace') return;
            ink.getContext('2d').clearRect(0, 0, ink.width, ink.height); ok = [false, false, false]; paintGhost();
        }
        function evaluate() {
            const gh = document.getElementById('gh'), ink = document.getElementById('ink'), w = gh.width;
            const a = gh.getContext('2d').getImageData(0, 0, w, gh.height).data;
            const b = ink.getContext('2d').getImageData(0, 0, w, ink.height).data;
            const m = [0, 0, 0], cv = [0, 0, 0]; let out = 0;
            for (let p = 3, px = 0; p < a.length; p += 4, px++) {
                const x = (px % w) / w, k = x < .35 ? 0 : x < .65 ? 1 : 2, M = a[p] > 128, I = b[p] > 128;
                if (M) { m[k]++; if (I) cv[k]++ } else if (I) out++;
            }
            for (let k = 0; k < 3; k++)if (m[k] && cv[k] / m[k] >= .5) ok[k] = true;
            paintGhost();
            if (ok.every(Boolean)) {
                if (out / (m[0] + m[1] + m[2]) <= .8) success();
                else { setBub('Tô theo nét mờ nhé. Thử lại!'); setTimeout(() => { clearInk(); setBub('Tô ' + R[i].n + ' = ' + R[i].n) }, 1200) }
            }
        }
        function setBub(t) { const bb = document.getElementById('bub'); if (bb) bb.innerHTML = `<span class="w said">${t}</span>` }

        /* ---------- thắng: cặp thú nhảy, dây nối, bập bênh boing ---------- */
        function arcs(pl, L, Rr) {
            const sv = document.getElementById('sv');
            sv.setAttribute('width', pl.offsetWidth); sv.setAttribute('height', pl.offsetHeight);
            sv.innerHTML = L.map((a, k) => {
                const b = Rr[k], x1 = a.offsetLeft + a.offsetWidth / 2, x2 = b.offsetLeft + b.offsetWidth / 2, y = a.offsetTop + a.offsetHeight * .1;
                const h = 22 + k * 15, mx = (x1 + x2) / 2;
                return `<path pathLength="1" d="M${x1} ${y}Q${mx} ${y - h * 2} ${x2} ${y}" style="stroke:${C[k % 6]};animation-delay:${(k * .35 + .2).toFixed(2)}s"/>`;
            }).join('');
        }
        function settle(pl, all) {
            let a = 0;
            try { const m = new DOMMatrix(getComputedStyle(pl).transform); a = Math.atan2(m.b, m.a) * 180 / Math.PI } catch (e) { }
            pl.style.animation = 'none'; pl.style.transform = `rotate(${a}deg)`; void pl.offsetWidth;
            pl.style.transition = 'transform .7s cubic-bezier(.3,1.9,.5,1)'; pl.style.transform = 'rotate(0deg)';
            all.forEach(e => e.classList.remove('hp'));
            boing();
            later(() => { pl.style.animation = 'rum .5s ease 2' }, 750);
        }
        function success() {
            step = 'say';
            const n = R[i].n, pl = document.getElementById('pl');
            document.getElementById('tr').classList.add('ok');
            pl.classList.add('done');
            const L = [...pl.querySelectorAll('.half.l .it')].reverse(), Rr = [...pl.querySelectorAll('.half.r .it')];
            arcs(pl, L, Rr);
            L.forEach((a, k) => {
                [a, Rr[k]].forEach(e => { e.style.setProperty('--dl', (k * .35) + 's'); e.classList.add('hp') });
                later(() => pop(k), k * 350 + 150);
            });
            const T = n * 350 + 500;
            later(() => {
                settle(pl, L.concat(Rr));
                document.getElementById('dog').classList.add('happy', 'clp');
            }, T);
            later(() => {
                document.getElementById('bub').innerHTML = words.map((t, k) => `<span class="w" data-k="${k}">${t}</span>`).join('');
                document.getElementById('rb').hidden = false;
                speakSeq();
            }, T + 1000);
        }

        /* ---------- đọc câu: thú nhún theo từng từ ---------- */
        function bounce() { const pl = document.getElementById('pl'); if (!pl) return; pl.classList.remove('bump'); void pl.offsetWidth; pl.classList.add('bump') }
        function mark(idx) {
            document.querySelectorAll('.w[data-k]').forEach(e => { const k = +e.dataset.k; e.className = 'w' + (k < idx ? ' said' : k === idx ? ' on' : '') });
            if (idx < words.length) bounce();
        }
        function speakSeq() {
            const id = ++spk; let k = 0;
            try { speechSynthesis.cancel() } catch (e) { }
            const dog = document.getElementById('dog'); if (dog) dog.classList.add('clp');
            const next = () => {
                if (id !== spk) return;
                if (k >= words.length) { mark(99); const d = document.getElementById('dog'); if (d) d.classList.remove('clp'); document.getElementById('nx').hidden = false; return }
                const idx = k++; mark(idx); let fired = false;
                const go = () => { if (fired) return; fired = true; setTimeout(next, 150) };
                try { const u = new SpeechSynthesisUtterance(words[idx].replace('.', '')); u.lang = 'en-US'; u.rate = .75; u.onend = go; u.onerror = go; speechSynthesis.speak(u) } catch (e) { }
                setTimeout(go, 2200);
            };
            next();
        }
        function end() {
            setStars();
            app.innerHTML = `<div class="end"><div class="st">🐶⭐</div><h2>Great job!</h2><button class="big" id="again">Play again</button></div>`;
            document.getElementById('again').onclick = () => { i = 0; newRound() };
        }
        let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (step === 'trace' && document.getElementById('tr')) { ok = [false, false, false]; setupCanvas() } }, 150) });
        newRound();
    </script>
</body>
