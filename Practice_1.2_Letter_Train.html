<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practice 1 - Letter Train</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;font-family:"Comic Sans MS","Baloo 2","Trebuchet MS",sans-serif;user-select:none;touch-action:manipulation}
  body{--u:min(13.5vw,112px);background:linear-gradient(#8ed1ff 0%,#d7f1ff 52%,#9be26e 52%,#7bcf53 100%);display:flex;flex-direction:column;align-items:center;overflow:hidden}

  .cloud{position:absolute;background:#fff;border-radius:50px;opacity:.9;animation:drift linear infinite}
  .cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
  .cloud::before{width:50%;height:160%;left:15%;top:-60%}
  .cloud::after{width:40%;height:130%;left:50%;top:-40%}
  @keyframes drift{from{transform:translateX(-220px)}to{transform:translateX(110vw)}}
  .hill{position:absolute;bottom:48%;border-radius:50% 50% 0 0;background:#6fc84a;z-index:0}

  #hud{width:100%;display:flex;justify-content:space-between;align-items:center;padding:10px 18px;z-index:5}
  #title{background:#fff;border-radius:20px;padding:6px 16px;font-weight:bold;color:#e8590c;font-size:clamp(16px,2.6vw,26px);box-shadow:0 3px 0 #ffd199}
  #score{font-size:clamp(20px,3vw,30px);background:#fff;border-radius:20px;padding:4px 14px;box-shadow:0 3px 0 #cfe}

  #hint{display:flex;align-items:center;gap:10px;z-index:5;font-weight:bold;font-size:clamp(16px,2.8vw,26px);color:#1864ab;background:rgba(255,255,255,.85);border-radius:20px;padding:6px 14px}
  #level{background:#ff922b;color:#fff;border-radius:14px;padding:2px 12px}
  #speak{width:44px;height:44px;border-radius:50%;border:none;background:#4dabf7;color:#fff;font-size:20px;cursor:pointer;box-shadow:0 4px 0 #1c7ed6}
  #speak:active{transform:translateY(3px);box-shadow:0 1px 0 #1c7ed6}

  #trackArea{position:relative;flex:1;width:100%;display:flex;align-items:center;justify-content:center;z-index:2;min-height:calc(var(--u)*2)}
  #track{position:absolute;left:0;right:0;top:50%;margin-top:calc(var(--u)*.62);height:12px;background:#6c757d;border-top:3px solid #495057;border-bottom:3px solid #495057}
  #track::after{content:"";position:absolute;left:0;right:0;top:12px;height:10px;background:repeating-linear-gradient(90deg,#8d5a2b 0 14px,transparent 14px 38px)}
  #train{display:flex;align-items:flex-end;transform:translateX(-130vw);position:relative;z-index:2}
  #train.in{transform:translateX(0);transition:transform 1.1s cubic-bezier(.2,.7,.3,1)}
  #train.out{transform:translateX(130vw);transition:transform 1.9s cubic-bezier(.5,0,.9,.5)}
  #train.bob{animation:chugbob .3s ease-in-out infinite}
  @keyframes chugbob{0%,100%{margin-bottom:0}50%{margin-bottom:3px}}

  .loco{position:relative;width:calc(var(--u)*1.7);height:calc(var(--u)*1.15);background:#e03131;border-radius:16px 30px 6px 6px;box-shadow:inset 0 -8px 0 rgba(0,0,0,.18)}
  .loco .cab{position:absolute;left:6%;top:-24%;width:42%;height:42%;background:#c92a2a;border-radius:10px 10px 0 0}
  .loco .chim{position:absolute;right:16%;top:-20%;width:16%;height:24%;background:#343a40;border-radius:4px 4px 0 0}
  .loco .chim::before{content:"";position:absolute;left:-30%;right:-30%;top:-6px;height:10px;background:#343a40;border-radius:6px}
  .smoke{position:absolute;right:20%;top:-38%;width:18px;height:18px;border-radius:50%;background:#f1f3f5;opacity:0;animation:smoke 1.8s linear infinite}
  .smoke:nth-child(2){animation-delay:-.6s}.smoke:nth-child(3){animation-delay:-1.2s}
  @keyframes smoke{0%{transform:translate(0,0) scale(.4);opacity:.9}100%{transform:translate(-30px,-60px) scale(1.8);opacity:0}}
  .loco .plate{position:absolute;right:5%;top:12%;width:50%;aspect-ratio:1;background:#fff8dc;border:5px solid #ffd43b;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:calc(var(--u)*.52);font-weight:bold;color:#e8590c}
  .wheel{position:absolute;bottom:-14%;width:calc(var(--u)*.32);height:calc(var(--u)*.32);background:#343a40;border:4px solid #adb5bd;border-radius:50%}
  .wheel::after{content:"";position:absolute;inset:30%;background:#adb5bd;border-radius:50%}
  .coup{width:calc(var(--u)*.14);height:8px;background:#343a40;margin-bottom:calc(var(--u)*.18)}
  .wag{position:relative;width:var(--u);height:calc(var(--u)*1.15);border-radius:10px 10px 6px 6px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -8px 0 rgba(0,0,0,.18)}
  .wag .slot{width:78%;height:70%;background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:calc(var(--u)*.52);font-weight:bold;color:#1971c2}
  .wag .slot.blank{background:rgba(255,255,255,.35);border:4px dashed #fff;color:#fff;animation:blink 1.1s ease-in-out infinite}
  @keyframes blink{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  .wag .slot.hot{background:#fff;border-color:#ffd43b}
  .wag .slot.filled{background:#fff;border:none;color:#2f9e44;animation:none}
  .wag.shake{animation:shake .45s}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}
  .wag.glow{filter:drop-shadow(0 0 14px #ffe066) brightness(1.1)}

  #platform{position:relative;width:100%;z-index:4;background:linear-gradient(#ced4da,#adb5bd);border-top:10px solid #868e96;padding:16px 10px 18px;display:flex;justify-content:center;align-items:center;gap:clamp(10px,3vw,30px);min-height:calc(var(--u)*1.5)}
  #platform::before{content:"PLATFORM";position:absolute;left:12px;top:-4px;font-size:11px;letter-spacing:4px;color:#495057;transform:translateY(-100%);opacity:0}
  .tile{width:calc(var(--u)*.95);height:calc(var(--u)*.95);border:none;border-radius:18px;background:#fff8dc;border-bottom:6px solid #e0a800;color:#d6336c;font:inherit;font-size:calc(var(--u)*.6);font-weight:bold;display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none;transform:rotate(var(--r));box-shadow:0 6px 8px rgba(0,0,0,.25);position:relative}
  .tile.drag{cursor:grabbing;z-index:50;box-shadow:0 14px 18px rgba(0,0,0,.35)}
  .tile.placed{visibility:hidden}

  #msg{position:fixed;left:50%;top:32%;transform:translate(-50%,-50%) scale(0);font-size:clamp(36px,8vw,80px);font-weight:bold;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.35);z-index:40;pointer-events:none;white-space:nowrap}
  #msg.show{animation:msg 1.3s forwards}
  @keyframes msg{0%{transform:translate(-50%,-50%) scale(0)}25%{transform:translate(-50%,-50%) scale(1.15)}70%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
  .conf{position:fixed;font-size:28px;z-index:30;pointer-events:none;animation:fall 1.2s ease-out forwards}
  @keyframes fall{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--dx),var(--dy)) rotate(360deg) scale(.6);opacity:0}}

  #end{position:fixed;inset:0;background:rgba(255,255,255,.95);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:50;text-align:center}
  #end h1{font-size:clamp(36px,7vw,72px);color:#e8590c}
  #end .big{font-size:clamp(28px,6vw,60px);max-width:90vw;line-height:1.3}
  #start{position:fixed;inset:0;background:linear-gradient(#8ed1ff,#d7f1ff);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:60;text-align:center;padding:20px}
  #start h1{font-size:clamp(34px,7vw,70px);color:#e8590c;text-shadow:0 3px 0 #fff}
  #start p{font-size:clamp(18px,3vw,28px);color:#1864ab;max-width:700px}
  .bigbtn{font:inherit;font-size:clamp(26px,5vw,44px);padding:12px 50px;border:none;border-radius:50px;background:#ff922b;color:#fff;cursor:pointer;box-shadow:0 7px 0 #d9480f}
  .bigbtn:active{transform:translateY(5px);box-shadow:0 2px 0 #d9480f}
</style>
</head>
<body>
<div class="cloud" style="width:140px;height:40px;top:12%;animation-duration:60s"></div>
<div class="cloud" style="width:100px;height:30px;top:26%;animation-duration:45s;animation-delay:-20s"></div>
<div class="hill" style="left:-5%;width:45%;height:14%"></div>
<div class="hill" style="right:-8%;width:50%;height:18%;background:#62bd3d"></div>

<div id="hud">
  <div id="title">🚂 Letter Train</div>
  <div id="score">⭐ 0 / 10</div>
</div>

<div id="hint">
  <span id="level">Level 1</span>
  <span>Drag the letter to the empty wagon!</span>
  <button id="speak" title="Listen">🔊</button>
</div>

<div id="trackArea">
  <div id="track"></div>
  <div id="train"></div>
</div>

<div id="platform"></div>

<div id="msg"></div>

<div id="start">
  <h1>🚂 Letter Train 🚂</h1>
  <p>Look at the number on the engine.<br>Drag the missing letter into the empty wagon!<br><b>7 → se_en</b> → drag <b>v</b> into the wagon</p>
  <button class="bigbtn" id="startBtn">▶ Play</button>
</div>

<div id="end">
  <h1>Choo choo! Well done! 🎉</h1>
  <div class="big" id="endStars"></div>
  <button class="bigbtn" id="again" style="background:#40c057;box-shadow:0 7px 0 #2b8a3e">↻ Play again</button>
</div>

<script>
(function(){
  var WORDS={6:"six",7:"seven",8:"eight",9:"nine",10:"ten"};
  var WCOL=["#339af0","#51cf66","#fcc419","#cc5de8","#ff922b"];
  var POOL="";
  Object.keys(WORDS).forEach(function(k){WORDS[k].split("").forEach(function(c){if(POOL.indexOf(c)<0)POOL+=c})});
  var trainEl=document.getElementById("train"),platEl=document.getElementById("platform"),
      scoreEl=document.getElementById("score"),levelEl=document.getElementById("level"),msgEl=document.getElementById("msg");
  var rounds,idx,score,cur,slots,filled,need,locked,wrong,audioCtx;

  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  function tone(freq,dur,type,delay,vol){
    try{
      audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
      var o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.type=type||"sine";o.frequency.value=freq;
      var t0=audioCtx.currentTime+(delay||0);
      g.gain.setValueAtTime(vol||.2,t0);g.gain.exponentialRampToValueAtTime(.001,t0+dur);
      o.connect(g);g.connect(audioCtx.destination);o.start(t0);o.stop(t0+dur);
    }catch(e){}
  }
  function sfxOK(){tone(880,.1,"triangle",0,.25);tone(1175,.15,"triangle",.1,.25)}
  function sfxBad(){tone(220,.25,"sawtooth",0,.12);tone(165,.3,"sawtooth",.15,.12)}
  function sfxPick(){tone(520,.07,"square",0,.05)}
  function whistle(){tone(740,.25,"triangle",0,.22);tone(990,.4,"triangle",.32,.22)}
  function chug(n,gap){for(var i=0;i<n;i++){tone(110+(i%2)*25,.07,"square",i*gap,.07)}}
  function speak(t){try{if(!window.speechSynthesis)return;speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.8;u.pitch=1.2;speechSynthesis.speak(u)}catch(e){}}
  function showMsg(t){msgEl.textContent=t;msgEl.classList.remove("show");void msgEl.offsetWidth;msgEl.classList.add("show")}
  function confetti(){
    var r=trainEl.getBoundingClientRect(),em=["🎉","⭐","✨","🎊","💛"];
    for(var i=0;i<14;i++){
      var c=document.createElement("div");c.className="conf";c.textContent=em[i%em.length];
      c.style.left=(r.left+r.width/2)+"px";c.style.top=(r.top)+"px";
      c.style.setProperty("--dx",(Math.random()*300-150)+"px");
      c.style.setProperty("--dy",(Math.random()*-220)+"px");
      document.body.appendChild(c);
      setTimeout(function(el){return function(){el.remove()}}(c),1300);
    }
  }

  function makeRounds(){
    var list=[];
    shuffle([6,7,8,9,10]).forEach(function(n){
      list.push({n:n,pos:[Math.floor(Math.random()*WORDS[n].length)]});
    });
    var l2=shuffle([6,7,8,9,10]);
    if(l2[0]===list[list.length-1].n){var t=l2[0];l2[0]=l2[1];l2[1]=t}
    l2.forEach(function(n){
      var len=WORDS[n].length,p=shuffle(Array.apply(null,Array(len)).map(function(_,i){return i})).slice(0,2).sort();
      list.push({n:n,pos:p});
    });
    return list;
  }

  function newRound(){
    cur=rounds[idx];var word=WORDS[cur.n];
    filled=0;need=cur.pos.length;locked=true;wrong=false;slots=[];
    levelEl.textContent=need===1?"Level 1":"Level 2";
    /* train */
    trainEl.className="";trainEl.innerHTML="";
    var loco=document.createElement("div");loco.className="loco";
    loco.innerHTML='<div class="cab"></div><div class="chim"></div><div class="smoke"></div><div class="smoke"></div><div class="smoke"></div><div class="plate">'+cur.n+'</div>'+
      '<div class="wheel" style="left:12%"></div><div class="wheel" style="left:52%"></div>';
    trainEl.appendChild(loco);
    word.split("").forEach(function(ch,i){
      var c=document.createElement("div");c.className="coup";trainEl.appendChild(c);
      var w=document.createElement("div");w.className="wag";w.style.background=WCOL[i%WCOL.length];
      var s=document.createElement("div");s.className="slot";
      if(cur.pos.indexOf(i)>=0){s.classList.add("blank");s.textContent="?";slots.push({wag:w,slot:s,letter:ch,done:false})}
      else s.textContent=ch;
      w.appendChild(s);
      w.insertAdjacentHTML("beforeend",'<div class="wheel" style="left:12%"></div><div class="wheel" style="right:12%"></div>');
      trainEl.appendChild(w);
    });
    /* tiles */
    var need_letters=cur.pos.map(function(p){return word[p]});
    var distract=shuffle(POOL.split("").filter(function(c){return word.indexOf(c)<0})).slice(0,3);
    platEl.innerHTML="";
    shuffle(need_letters.concat(distract)).forEach(function(ch){
      var t=document.createElement("div");t.className="tile";t.textContent=ch;t.dataset.l=ch;
      t.style.setProperty("--r",(Math.random()*16-8)+"deg");
      attachDrag(t);platEl.appendChild(t);
    });
    /* enter */
    void trainEl.offsetWidth;
    trainEl.classList.add("in");chug(8,.13);
    setTimeout(function(){trainEl.classList.add("bob")},50);
    setTimeout(function(){trainEl.classList.remove("bob");locked=false;speak(word)},1150);
  }

  function attachDrag(t){
    var sx,sy,dragging=false,moved=0,r0="0deg";
    t.addEventListener("pointerdown",function(e){
      if(locked||t.classList.contains("placed"))return;
      dragging=true;moved=0;sx=e.clientX;sy=e.clientY;
      t.setPointerCapture(e.pointerId);t.classList.add("drag");t.style.transition="none";sfxPick();
    });
    t.addEventListener("pointermove",function(e){
      if(!dragging)return;
      var dx=e.clientX-sx,dy=e.clientY-sy;moved=Math.abs(dx)+Math.abs(dy);
      t.style.transform="translate("+dx+"px,"+dy+"px) scale(1.12)";
    });
    function release(e){
      if(!dragging)return;dragging=false;t.classList.remove("drag");
      var target=null;
      if(moved<12){
        for(var i=0;i<slots.length;i++){if(!slots[i].done){target=slots[i];break}}
      }else{
        var r=t.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,best=1e9;
        slots.forEach(function(s){
          if(s.done)return;
          var sr=s.wag.getBoundingClientRect(),
              dx=Math.max(sr.left-cx,0,cx-sr.right),dy=Math.max(sr.top-cy,0,cy-sr.bottom),
              d=Math.sqrt(dx*dx+dy*dy);
          if(d<sr.width*.35&&d<best){best=d;target=s}
        });
      }
      if(!target){giveBack(t);return}
      if(t.dataset.l===target.letter){
        target.done=true;t.classList.add("placed");t.style.transform="";
        target.slot.className="slot filled";target.slot.textContent=target.letter;
        target.wag.classList.add("glow");
        sfxOK();filled++;
        if(filled===need)complete();
      }else{
        wrong=true;sfxBad();
        target.wag.classList.remove("shake");void target.wag.offsetWidth;target.wag.classList.add("shake");
        giveBack(t);
      }
    }
    t.addEventListener("pointerup",release);
    t.addEventListener("pointercancel",release);
  }
  function giveBack(t){
    t.style.transition="transform .3s ease";t.style.transform="";
    setTimeout(function(){t.style.transition=""},320);
  }

  function complete(){
    locked=true;
    var word=WORDS[cur.n];
    if(!wrong){score++;scoreEl.textContent="⭐ "+score+" / 10"}
    showMsg(word+"! ✔");confetti();
    setTimeout(function(){whistle();speak(word+". Good job!")},250);
    idx++;
    setTimeout(function(){
      trainEl.classList.remove("in");trainEl.classList.add("out","bob");chug(14,.13);
    },1500);
    setTimeout(function(){if(idx>=rounds.length)finish();else newRound()},3500);
  }

  function finish(){
    [523,659,784,1047].forEach(function(f,i){tone(f,.3,"triangle",i*.15,.25)});
    var s="";for(var i=0;i<10;i++)s+=i<score?"⭐":"☆";
    document.getElementById("endStars").textContent=s;
    document.getElementById("end").style.display="flex";
  }

  function startGame(){
    rounds=makeRounds();idx=0;score=0;
    scoreEl.textContent="⭐ 0 / 10";
    document.getElementById("end").style.display="none";
    newRound();
  }

  document.getElementById("speak").addEventListener("click",function(){if(cur)speak(WORDS[cur.n])});
  document.getElementById("startBtn").addEventListener("click",function(){
    document.getElementById("start").style.display="none";
    tone(1,.01,"sine",0,.001);
    startGame();
  });
  document.getElementById("again").addEventListener("click",startGame);
})();
</script>
</body>
</html>
