<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Count, match and say - Bowling</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --orange:#D9803A; --orange-d:#B9661F; --brown:#2B1D14; --cream:#FDF9F0; --sand:#F7EFE0;
  --green:#5E8C3A; --ok:#3FA564; --bad:#D9534F; --line:#F0DDBE;
  --font:'Baloo 2','Nunito','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:transparent;font-family:var(--font);color:var(--brown);
  user-select:none;-webkit-user-select:none;touch-action:manipulation}
body{display:grid;place-items:center}
button{font-family:inherit;color:inherit}

/* Khung game co dinh 1000x560, tu scale vua khung chua -> khong bao gio phai cuon */
#fit{position:relative}
#stage{position:absolute;left:0;top:0;width:1000px;height:560px;transform-origin:0 0;
  background:var(--sand);border-radius:28px;overflow:hidden}
#stage::after{content:'';position:absolute;inset:0;border:6px solid var(--green);border-radius:28px;pointer-events:none;z-index:50}
#bg{position:absolute;left:0;top:0;z-index:0}

/* HUD */
#hud{position:absolute;left:0;top:0;width:1000px;height:70px;padding:12px 28px 0;z-index:10;
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
#stars{display:flex;gap:6px;font-size:26px}
.star{filter:grayscale(1);opacity:.35;transition:.3s}
.star.on{filter:none;opacity:1;transform:scale(1.15)}
#instr{background:#fff;border:3px solid var(--orange);border-radius:999px;padding:2px 28px;text-align:center;line-height:1.05}
#instr b{display:block;font-size:26px;font-weight:800}
#instr small{font-size:14px;opacity:.7}
#spk{justify-self:end;width:48px;height:48px;border-radius:50%;border:3px solid #E9CFA9;background:#FFF7E8;font-size:22px;cursor:pointer}

/* Scene */
#pins{position:absolute;inset:0;z-index:3;pointer-events:none}
.pin{position:absolute;width:32px;height:64px;transform-origin:50% 100%;
  transition:transform .45s ease-out,opacity .4s ease .45s}
.pin svg{width:100%;height:100%;display:block}
.pin.wob{animation:wob .5s .15s}
#ball{position:absolute;left:212px;top:480px;width:56px;height:56px;z-index:6;cursor:pointer}
#ball::after{content:'';position:absolute;inset:-14px}
#ball svg{width:100%;height:100%;display:block}
#ball.ready{animation:pulse 1s infinite}
#hint{position:absolute;left:275px;top:488px;font-size:36px;z-index:7;pointer-events:none;animation:nudge 1s infinite}
#toast{position:absolute;left:34px;top:350px;width:430px;text-align:center;font-size:30px;font-weight:800;
  background:#fff;border:3px solid var(--orange);border-radius:999px;padding:4px 10px;
  opacity:0;transform:scale(.8);transition:.25s;z-index:20;pointer-events:none}
#toast.show{opacity:1;transform:none}

/* Tray (ten-frame) */
#tray{position:absolute;left:498px;top:76px;width:480px;height:216px;background:#fff;border:3px solid var(--line);
  border-radius:22px;padding:10px 14px;z-index:4}
#trayhead{display:flex;justify-content:space-between;align-items:center;height:38px}
#trayhead span{font-size:21px;font-weight:800}
#cnt{width:38px;height:38px;border-radius:50%;background:var(--orange);color:#fff;font-size:24px;font-weight:800;
  display:grid;place-items:center}
#slots{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:6px}
.slot{height:70px;border:2.5px dashed #E2CFAE;border-radius:14px;display:grid;place-items:center;position:relative}
.tpin{background:none;border:0;cursor:pointer;position:relative;width:64px;height:66px;display:grid;place-items:center;
  animation:pop .35s backwards}
.tpin svg{width:32px;height:62px;display:block;pointer-events:none}
.tpin.tap:not(.counted){animation:pulse 1s infinite}
.tpin.counted svg{filter:drop-shadow(0 0 5px var(--ok))}
.tpin.hl{animation:bounce .5s}
.num{position:absolute;right:2px;top:-2px;width:26px;height:26px;border-radius:50%;background:var(--ok);color:#fff;
  font-size:16px;font-weight:800;display:none;place-items:center}
.counted .num{display:grid}

/* Bottom area: idle / cards / say */
#bottom{position:absolute;left:498px;top:304px;width:480px;height:242px;z-index:4}
#bottom.idle{border:3px dashed #E6D5B8;border-radius:22px;display:grid;place-items:center}
#bottom.idle::after{content:'\1F3B3';font-size:72px;opacity:.2}
#bottom.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card{background:#fff;border:4px solid var(--line);border-radius:22px;padding:8px;display:grid;place-items:center;
  cursor:pointer;transition:transform .15s,border-color .15s;animation:pop .35s backwards}
.card:hover{border-color:var(--orange);transform:translateY(-3px)}
.card.right{border-color:var(--ok);background:#E8F7EC;animation:bounce .5s}
.card.wrong{border-color:var(--bad);background:#FDECEA;animation:shake .4s}
.card.off{opacity:.35;pointer-events:none}
.items{display:grid;justify-items:center;align-items:center;gap:2px 4px;line-height:1.05}
.none{width:70px;height:70px;border:4px dashed #E2CFAE;border-radius:50%}
#bottom.saybox{background:#fff;border:3px solid var(--line);border-radius:22px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:6px;animation:pop .35s}
.big{display:flex;align-items:center;gap:18px}
.bignum{background:var(--orange);color:#fff;font-weight:800;font-size:58px;line-height:1;width:90px;height:90px;
  border-radius:22px;display:grid;place-items:center}
.bigword{font-size:74px;font-weight:800;line-height:1}
.q{font-size:20px;opacity:.75}
.row{display:flex;gap:14px}
#micmsg{font-size:15px;min-height:18px;opacity:.7}

.btn{font:800 22px var(--font);border-radius:999px;padding:6px 26px;border:0;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn.primary{background:var(--orange);color:#fff}
.btn.ghost{background:#fff;border:3px solid #E9CFA9}
.btn.live{background:var(--ok);animation:pulse .8s infinite}
.btn.big{font-size:34px;padding:8px 48px}

/* Overlay */
#overlay{position:absolute;inset:0;z-index:40;background:rgba(253,249,240,.95);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:6px}
#overlay.hide{display:none}
#ovTitle{font-size:54px;font-weight:800;line-height:1}
#ovSub{font-size:22px;opacity:.7}
#ovEmoji{font-size:80px;margin:8px 0}

.conf{position:absolute;top:-40px;z-index:30;pointer-events:none;animation:confall 1.8s ease-in forwards}

@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
@keyframes pulse{50%{scale:1.1}}
@keyframes bounce{40%{transform:translateY(-14px)}70%{transform:translateY(0)}85%{transform:translateY(-5px)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes nudge{50%{transform:translateX(-10px)}}
@keyframes wob{0%,100%{rotate:0deg}30%{rotate:-6deg}70%{rotate:6deg}}
@keyframes confall{to{transform:translateY(640px) rotate(360deg)}}
</style>
</head>
<body>
<div id="fit">
<div id="stage">

  <!-- Background: lane (nhin tu sau lung nguoi nem) -->
  <svg id="bg" width="1000" height="560" viewBox="0 0 1000 560">
    <defs>
      <clipPath id="cp"><rect x="14" y="76" width="466" height="470" rx="22"/></clipPath>
      <linearGradient id="lane" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#F1C97E"/><stop offset="1" stop-color="#E3A94F"/>
      </linearGradient>
    </defs>
    <g clip-path="url(#cp)">
      <rect x="14" y="76" width="466" height="32" fill="#8FB8D0"/>
      <rect x="14" y="108" width="466" height="438" fill="#7A5B40"/>
      <rect x="150" y="96" width="180" height="14" rx="4" fill="#3A3A46"/>
      <polygon points="150,108 330,108 460,546 20,546" fill="url(#lane)"/>
      <g stroke="#D69B45" stroke-width="1.5">
        <line x1="190.8" y1="108" x2="123.6" y2="546"/>
        <line x1="223.6" y1="108" x2="201.2" y2="546"/>
        <line x1="256.4" y1="108" x2="278.8" y2="546"/>
        <line x1="289.2" y1="108" x2="356.4" y2="546"/>
      </g>
      <polygon points="150,108 158,108 46,546 20,546" fill="#3A3A46"/>
      <polygon points="322,108 330,108 460,546 434,546" fill="#3A3A46"/>
      <g fill="#C9893A">
        <polygon points="190,350 181,372 199,372"/>
        <polygon points="240,336 231,358 249,358"/>
        <polygon points="290,350 281,372 299,372"/>
      </g>
    </g>
  </svg>

  <!-- HUD -->
  <div id="hud">
    <div id="stars"></div>
    <div id="instr"><b></b><small></small></div>
    <button id="spk" aria-label="Listen">&#128266;</button>
  </div>

  <div id="pins"></div>

  <div id="ball">
    <svg viewBox="0 0 56 56">
      <defs><radialGradient id="ballg" cx=".35" cy=".3"><stop offset="0" stop-color="#6F8BFF"/><stop offset="1" stop-color="#1D2B7A"/></radialGradient></defs>
      <circle cx="28" cy="28" r="27" fill="url(#ballg)" stroke="#142060" stroke-width="2"/>
      <circle cx="22" cy="20" r="3.5" fill="#0d1440"/><circle cx="32" cy="18" r="3.5" fill="#0d1440"/><circle cx="28" cy="28" r="3.5" fill="#0d1440"/>
      <ellipse cx="18" cy="14" rx="6" ry="3.5" fill="#fff" opacity=".35" transform="rotate(-30 18 14)"/>
    </svg>
  </div>
  <div id="hint">&#128072;</div>
  <div id="toast"></div>

  <!-- Right panel -->
  <div id="tray">
    <div id="trayhead"><span>Fallen pins</span><div id="cnt">0</div></div>
    <div id="slots"></div>
  </div>
  <div id="bottom" class="idle"></div>

  <div id="overlay" class="hide">
    <div id="ovTitle">Count, match and say!</div>
    <div id="ovSub">Đếm – Chọn – Nói</div>
    <div id="ovEmoji">&#127859;</div>
    <button class="btn primary big" id="go">Play!</button>
  </div>
</div>
</div>

<script>
(() => {
/* ================== CẤU HÌNH (sửa ở đây) ================== */
const ROUNDS = [3, 5, 2, 7, 10];   // số pin đổ ở mỗi lượt (0-10). Số 0 = bóng rơi vào rãnh
const OBJS   = ['🍎','🐟','⭐','🚗','🐶','🎈','🍌','🐱','🍓','🌼'];  // đồ vật trong các ô đáp án
/* ========================================================== */

const WORDS = ['zero','one','two','three','four','five','six','seven','eight','nine','ten'];
const HOMO  = {0:['zero'],1:['one','won'],2:['two','to','too'],4:['four','for'],8:['eight','ate']};
const INSTR = {
  throw:['Throw the ball!','Chạm vào quả bóng để ném'],
  count:['Count the fallen pins!','Chạm từng cây pin đã đổ để đếm'],
  match:['Find the same number!','Chọn ô có số đồ vật bằng số pin đổ'],
  say:  ['Say it!','Nói to số pin đã đổ']
};
const $ = s => document.querySelector(s);
const wait = ms => new Promise(r => setTimeout(r, ms));
const rand = (a,b) => a + Math.random()*(b-a);
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; };

/* ---------- Scale vừa khung ---------- */
const fit=$('#fit'), stage=$('#stage');
function resize(){
  const s=Math.min(innerWidth/1000, innerHeight/560);
  fit.style.width=1000*s+'px'; fit.style.height=560*s+'px';
  stage.style.transform=`scale(${s})`;
}
addEventListener('resize',resize); resize();

/* ---------- Âm thanh ---------- */
let ac;
function audio(){ if(!ac){ try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){} } if(ac&&ac.state==='suspended') ac.resume(); return ac; }
function tone(f,d=.15,type='sine',t0=0,vol=.18){
  const a=audio(); if(!a) return;
  const o=a.createOscillator(), g=a.createGain(); o.type=type; o.frequency.value=f;
  const t=a.currentTime+t0; g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+d);
}
function crash(){
  const a=audio(); if(!a) return;
  const len=Math.floor(a.sampleRate*.5), buf=a.createBuffer(1,len,a.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);
  const s=a.createBufferSource(), g=a.createGain(); s.buffer=buf; g.gain.value=.5; s.connect(g).connect(a.destination); s.start();
}
const sfx = {
  ok:()=>{tone(660,.12,'triangle');tone(880,.2,'triangle',.12)},
  bad:()=>tone(180,.25,'sawtooth',0,.1),
  pop:i=>tone(480+i*50,.1,'sine',0,.15)
};

/* ---------- Giọng đọc tiếng Anh ---------- */
let voice=null;
function pickVoice(){
  const v=speechSynthesis.getVoices();
  voice=v.find(x=>/en[-_]US/i.test(x.lang)&&/female|samantha|google|zira|aria|jenny/i.test(x.name))||v.find(x=>/^en/i.test(x.lang))||null;
}
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
function say(text,rate=.85){
  if(!('speechSynthesis' in window)) return Promise.resolve();
  return new Promise(res=>{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text); u.lang='en-US'; if(voice)u.voice=voice; u.rate=rate; u.pitch=1.1;
    u.onend=res; u.onerror=res; setTimeout(res,4000); speechSynthesis.speak(u);
  });
}

/* ---------- Dữ liệu hình ---------- */
const PIN_SVG=`<svg viewBox="0 0 32 64"><circle cx="16" cy="9" r="7.5" fill="#fff"/><path d="M11.5 14C11.5 24 4.5 29 4.5 43c0 12 5 19 11.5 19s11.5-7 11.5-19c0-14-7-19-7-29z" fill="#fff"/><path d="M10.5 19h11M9 24.500h14" stroke="#D9453A" stroke-width="3"/><circle cx="16" cy="9" r="7.5" fill="none" stroke="#2B1D14" stroke-width="2"/><path d="M11.5 14C11.5 24 4.5 29 4.5 43c0 12 5 19 11.5 19s11.5-7 11.5-19c0-14-7-19-7-29z" fill="none" stroke="#2B1D14" stroke-width="2"/></svg>`;

/* ---------- Phần tử ---------- */
const pinEls=[], slots=[];
const ball=$('#ball'), hint=$('#hint'), bottom=$('#bottom'), starsEl=$('#stars');
const stars=[];
ROUNDS.forEach(()=>{const s=document.createElement('span');s.className='star';s.textContent='⭐';starsEl.appendChild(s);stars.push(s)});
for(let i=0;i<10;i++){const d=document.createElement('div');d.className='slot';$('#slots').appendChild(d);slots.push(d)}
(function buildPins(){
  const wrap=$('#pins');
  for(let r=0;r<4;r++){
    const cnt=4-r, s=.82+.08*r, y=168+38*r;
    for(let j=0;j<cnt;j++){
      const x=240+(j-(cnt-1)/2)*46, d=document.createElement('div');
      d.className='pin'; d.style.left=(x-16)+'px'; d.style.top=(y-64)+'px'; d.style.zIndex=r+1;
      d.dataset.s=s; d.style.transform=`scale(${s})`; d.innerHTML=PIN_SVG; wrap.appendChild(d); pinEls.push(d);
    }
  }
})();

/* ---------- Trạng thái ---------- */
let state='idle', round=0, n=0, counted=0, mistakes=0, fallen=[], cur='throw';
let toastT;
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('show'),1500)}
function setInstr(k,speak=true){
  cur=k; $('#instr b').textContent=INSTR[k][0]; $('#instr small').textContent=INSTR[k][1];
  if(speak) say(INSTR[k][0]);
}
$('#spk').onclick=()=>{audio();say(INSTR[cur][0])};

function confetti(){
  for(let i=0;i<26;i++){
    const s=document.createElement('span'); s.className='conf'; s.textContent=['⭐','🎉','✨','🎳'][i%4];
    s.style.left=(40+Math.random()*920)+'px'; s.style.animationDelay=(Math.random()*.4)+'s'; s.style.fontSize=(20+Math.random()*18)+'px';
    stage.appendChild(s); setTimeout(()=>s.remove(),2400);
  }
}

/* ---------- Vòng chơi ---------- */
function resetScene(){
  pinEls.forEach(p=>{
    p.style.transition='none'; p.classList.remove('wob'); p.style.opacity=1; p.style.transform=`scale(${p.dataset.s})`;
    void p.offsetWidth; p.style.transition='';
  });
  ball.style.transition='none'; ball.style.transform='none'; ball.style.opacity=1; void ball.offsetWidth; ball.style.transition='';
  ball.classList.add('ready'); hint.style.display='';
  slots.forEach(s=>s.innerHTML=''); $('#cnt').textContent='0';
  bottom.className='idle'; bottom.innerHTML='';
}
function startRound(){
  n=ROUNDS[round]; counted=0; fallen=[];
  resetScene(); state='throw'; setInstr('throw');
}
ball.onclick=()=>{ if(state!=='throw') return; state='fall'; audio(); throwBall(); };

async function throwBall(){
  const gut = n===0;
  ball.classList.remove('ready'); hint.style.display='none';
  ball.style.transition='transform 1.15s cubic-bezier(.4,.05,.7,1),opacity .3s';
  ball.style.transform = gut ? 'translate(-125px,-258px) scale(.42) rotate(540deg)' : 'translate(0px,-273px) scale(.42) rotate(540deg)';
  tone(90,1.1,'sawtooth',0,.04);
  await wait(1100);
  if(gut){ toast('Oh no! Gutter!'); sfx.bad(); } else { crash(); knock(); }
  ball.style.opacity=0;
  await wait(1100);
  renderTray();
  if(gut){ await say('Oh! No pins fell. Zero!'); await wait(300); return goMatch(); }
  state='count'; setInstr('count');
  setTimeout(()=>document.querySelectorAll('.tpin').forEach(p=>p.classList.add('tap')),350+n*70);
}
function knock(){
  fallen=shuffle([...Array(10).keys()]).slice(0,n);
  pinEls.forEach((p,i)=>{
    if(fallen.includes(i)){
      const dir=Math.random()<.5?-1:1;
      p.style.transform=`translate(${rand(-36,36)}px,${rand(-30,-6)}px) rotate(${dir*rand(70,110)}deg) scale(${p.dataset.s})`;
      p.style.opacity=0;
    } else p.classList.add('wob');
  });
}

/* ---------- Count ---------- */
function renderTray(){
  slots.forEach(s=>s.innerHTML='');
  for(let i=0;i<n;i++){
    const b=document.createElement('button'); b.className='tpin'; b.style.animationDelay=(i*.07)+'s';
    b.innerHTML=PIN_SVG+'<span class="num"></span>'; b.onclick=()=>tapPin(b); slots[i].appendChild(b);
  }
}
function tapPin(b){
  if(state!=='count'||b.classList.contains('counted')) return;
  counted++; b.querySelector('.num').textContent=counted; b.classList.add('counted');
  $('#cnt').textContent=counted; sfx.pop(counted); say(WORDS[counted],.8);
  if(counted===n) finishCount();
}
async function finishCount(){ state='wait'; await wait(900); goMatch(); }
async function autoCount(){
  const pins=[...document.querySelectorAll('.tpin')];
  pins.forEach(p=>p.classList.remove('counted','hl','tap'));
  if(!pins.length){ $('#cnt').textContent='0'; await say('No pins. Zero!'); return; }
  for(let i=0;i<pins.length;i++){
    const p=pins[i]; p.querySelector('.num').textContent=i+1; p.classList.add('counted','hl');
    $('#cnt').textContent=i+1; sfx.pop(i+1); await say(WORDS[i+1],.8); await wait(100); p.classList.remove('hl');
  }
}

/* ---------- Match ---------- */
const COLS=[1,1,2,3,2,3,3,4,4,3,4];
function goMatch(){ state='match'; setInstr('match'); buildCards(); }
function buildCards(){
  const opts=new Set([n]);
  const cand=shuffle([n-2,n-1,n+1,n+2].filter(v=>v>=0&&v<=10));
  while(opts.size<3) opts.add(cand.pop());
  const list=shuffle([...opts]), kinds=shuffle([...OBJS]).slice(0,3);
  bottom.className='cards'; bottom.innerHTML='';
  list.forEach((v,i)=>{
    const b=document.createElement('button'); b.className='card'; b.dataset.v=v; b.style.animationDelay=(i*.08)+'s';
    const it=document.createElement('div'); it.className='items';
    if(v===0){ it.innerHTML='<span class="none"></span>'; }
    else{
      const c=COLS[v]; it.style.gridTemplateColumns=`repeat(${c},1fr)`;
      it.style.fontSize=Math.min(52,Math.floor(136/c)-4)+'px';
      it.innerHTML=Array(v).fill('<i style="font-style:normal">'+kinds[i]+'</i>').join('');
    }
    b.appendChild(it); b.onclick=()=>choose(b); bottom.appendChild(b);
  });
}
async function choose(b){
  if(state!=='match') return;
  const v=+b.dataset.v; state='wait'; audio();
  if(v===n){
    b.classList.add('right'); sfx.ok();
    await say('Yes! '+WORDS[n]+'!');
    goSay();
  }else{
    mistakes++; b.classList.add('wrong'); sfx.bad();
    await wait(450); b.classList.remove('wrong'); b.classList.add('off');
    await say("Let's count again!");
    await autoCount();
    state='match'; setInstr('match');
  }
}

/* ---------- Say ---------- */
let sayFails=0, listening=false;
function goSay(){
  state='say'; sayFails=0; listening=false; setInstr('say');
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  bottom.className='saybox';
  bottom.innerHTML=`<div class="big"><span class="bignum">${n}</span><span class="bigword">${WORDS[n]}</span></div>
    <div class="q">How many pins fell?</div>
    <div class="row"><button class="btn ghost" id="listen">🔊 Listen</button><button class="btn primary" id="mic">🎤 Say it!</button></div>
    <div id="micmsg">${SR?'Tap 🎤 and say the number':'Say it out loud, then tap 🎤'}</div>`;
  $('#listen').onclick=()=>{audio();say(WORDS[n]+'!',.7)};
  $('#mic').onclick=startMic;
}
function startMic(){
  if(state!=='say'||listening) return;
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR) return sayDone();                      // không có nhận diện giọng nói: tin HS đã nói
  const btn=$('#mic'), msg=$('#micmsg'); let done=false, r;
  const end=ok=>{
    if(done) return; done=true; listening=false; btn.classList.remove('live');
    if(ok===true||ok===null) return sayDone();
    sayFails++;
    if(sayFails>=2) return sayDone();            // thử 2 lần thì cho qua, tránh nản
    msg.textContent='Try again!'; say('Try again!');
  };
  try{
    r=new SR(); r.lang='en-US'; r.maxAlternatives=5; r.interimResults=false;
    listening=true; btn.classList.add('live'); msg.textContent='Listening…';
    r.onresult=e=>{
      const alts=[...e.results[0]].map(a=>a.transcript.toLowerCase());
      const words=HOMO[n]||[WORDS[n]];
      end(alts.some(t=>words.some(w=>new RegExp('\\b'+w+'\\b').test(t))||new RegExp('\\b'+n+'\\b').test(t)));
    };
    r.onerror=e=>end(['no-speech','aborted'].includes(e.error)?false:null);  // mic bị chặn/lỗi mạng: tin HS
    r.onend=()=>end(false);
    r.start();
  }catch(err){ end(null); }
}
async function sayDone(){
  if(state==='wait') return; state='wait';
  sfx.ok(); confetti(); stars[round].classList.add('on');
  toast(WORDS[n][0].toUpperCase()+WORDS[n].slice(1)+' pins! Great!');
  await say('Great job!'); await wait(900);
  round++;
  if(round>=ROUNDS.length) endGame(); else startRound();
}

/* ---------- Bắt đầu / kết thúc ---------- */
function showOverlay(title,emoji,sub,btn){
  $('#ovTitle').textContent=title; $('#ovEmoji').textContent=emoji; $('#ovSub').textContent=sub; $('#go').textContent=btn;
  $('#overlay').classList.remove('hide');
}
function endGame(){
  state='idle';
  showOverlay('Great job!','⭐'.repeat(ROUNDS.length), mistakes===0?'Perfect! Không sai lần nào!':'Bạn đã hoàn thành '+ROUNDS.length+' lượt ném!','Play again');
  confetti(); say('Great job!');
  // Báo cho trang web chứa game (nếu nhúng bằng iframe)
  try{ parent.postMessage({type:'game-complete',game:'bowling-count-match-say',mistakes},'*'); }catch(e){}
}
function begin(){
  $('#overlay').classList.add('hide');
  round=0; mistakes=0; stars.forEach(s=>s.classList.remove('on'));
  startRound();
}
$('#go').onclick=()=>{audio();begin();};
begin();
})();
</script>
