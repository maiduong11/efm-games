<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Match the numbers 0–5</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
<style>
:root{
  --bg:#eaf6f1; --card:#ffffff; --ink:#23403a;
  --num:#ff9a3c; --num-ink:#ffffff; --word:#3b8fe0; --word-ink:#ffffff;
  --sel:#ffd84d; --ok:#2fb36b;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#16302b;--card:#1f3d37;--ink:#eaf6f1;--sel:#ffe26b;}
}
:root[data-theme="dark"]{--bg:#16302b;--card:#1f3d37;--ink:#eaf6f1;--sel:#ffe26b;}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:12px}
h1{margin:0;font-size:clamp(22px,5vw,34px);font-weight:800;text-align:center}
.bar{display:flex;gap:10px;align-items:center;font-size:clamp(18px,4vw,26px);font-weight:600}
#stars{letter-spacing:4px}
#board{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:clamp(8px,2vw,16px);width:min(94vw,640px);aspect-ratio:4/3;background:var(--card);padding:clamp(10px,2vw,18px);border-radius:24px}
.b{border:0;border-radius:18px;font:inherit;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s,opacity .35s,box-shadow .15s;box-shadow:0 5px 0 rgba(0,0,0,.18);-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.b.n{background:var(--num);color:var(--num-ink);font-size:clamp(44px,12vw,84px)}
.b.w{background:var(--word);color:var(--word-ink);font-size:clamp(24px,6.5vw,46px)}
.b:focus-visible{outline:4px solid var(--ink);outline-offset:2px}
.b.sel{transform:scale(1.06);box-shadow:0 0 0 6px var(--sel),0 5px 0 rgba(0,0,0,.18)}
.b.bad{animation:shake .4s}
.b.ok{background:var(--ok);transform:scale(1.12)}
.b.gone{opacity:0;transform:scale(.4);pointer-events:none}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
#win{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:20px}
#win.show{display:flex}
#win div{background:var(--card);border-radius:28px;padding:28px 34px;text-align:center}
#win h2{margin:0 0 6px;font-size:clamp(28px,7vw,44px)}
#win p{margin:0 0 14px;font-size:clamp(34px,9vw,56px)}
button.again{font:inherit;font-weight:800;font-size:24px;border:0;border-radius:16px;padding:10px 28px;background:var(--ok);color:#fff;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.2)}
@media (prefers-reduced-motion:reduce){.b,.b.bad{animation:none;transition:none}}
</style>
</head>
<body>
<h1>Match the number and the word</h1>
<div class="bar"><span id="stars" aria-live="polite">☆☆☆☆☆☆</span></div>
<div id="board" role="group" aria-label="Number matching board"></div>
<div id="win" role="dialog" aria-live="polite"><div><h2>Well done!</h2><p>⭐⭐⭐</p><button class="again" id="again">Play again</button></div></div>

<script>
const WORDS=['zero','one','two','three','four','five'];
// Easy first: the first three pairs sit side by side, the last three are further apart.
const LAYOUT=[[0,'n'],[0,'w'],[1,'n'],[1,'w'],
              [2,'n'],[2,'w'],[3,'n'],[3,'w'],
              [4,'n'],[5,'n'],[4,'w'],[5,'w']];
const board=document.getElementById('board');
let sel=null,done=0,lock=false,ac=null;

function tone(freqs,dur){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    freqs.forEach((f,i)=>{
      const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*dur;
      o.frequency.value=f;o.type='sine';o.connect(g);g.connect(ac.destination);
      g.gain.setValueAtTime(.2,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
      o.start(t);o.stop(t+dur);
    });
  }catch(e){}
}
function say(k){
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(WORDS[k]);
    u.lang='en-US';u.rate=.8;speechSynthesis.speak(u);
  }catch(e){}
}
function build(){
  board.innerHTML='';sel=null;done=0;lock=false;
  document.getElementById('win').classList.remove('show');
  document.getElementById('stars').textContent='☆☆☆☆☆☆';
  LAYOUT.forEach(([k,type])=>{
    const b=document.createElement('button');
    b.className='b '+type;b.dataset.k=k;
    b.textContent=type==='n'?k:WORDS[k];
    b.setAttribute('aria-label',type==='n'?'number '+k:'word '+WORDS[k]);
    b.onclick=()=>tap(b);
    board.appendChild(b);
  });
}
function tap(b){
  if(lock||b.classList.contains('gone'))return;
  say(+b.dataset.k);
  if(sel===b){b.classList.remove('sel');sel=null;return;}
  if(!sel){sel=b;b.classList.add('sel');return;}
  const a=sel;sel=null;a.classList.remove('sel');
  const sameType=a.className.split(' ')[1]===b.className.split(' ')[1];
  if(a.dataset.k===b.dataset.k&&!sameType){
    lock=true;a.classList.add('ok');b.classList.add('ok');
    tone([660,880,1100],.12);
    done++;
    document.getElementById('stars').textContent='⭐'.repeat(done)+'☆'.repeat(6-done);
    setTimeout(()=>{a.classList.add('gone');b.classList.add('gone');lock=false;
      if(done===6){tone([523,659,784,1047],.18);document.getElementById('win').classList.add('show');}
    },500);
  }else{
    lock=true;a.classList.add('bad');b.classList.add('bad');
    tone([220],.2);
    setTimeout(()=>{a.classList.remove('bad');b.classList.remove('bad');lock=false;},420);
  }
}
document.getElementById('again').onclick=build;
build();
</script>
</body>
</html>
